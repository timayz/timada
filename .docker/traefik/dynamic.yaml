tls:
  certificates:
    - certFile: /etc/traefik/certs/timada.crt
      keyFile: /etc/traefik/certs/timada.key
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/timada.crt
        keyFile: /etc/traefik/certs/timada.key

http:
  routers:
    timada-dev:
      rule: "Host(`timada.localhost`)"
      tls: true
      service: timada-dev
      priority: 25
      entryPoints:
        - https
    storefront-dev:
      rule: "Host(`storefront.localhost`)"
      tls: true
      service: storefront-dev
      priority: 25
      entryPoints:
        - https

  services:
    # The three nodes of the local cluster (`cluster.web_peers` in
    # config/default.toml). Nodes that are not running fail the health check
    # and are left out, so a single `make dev` on port 3000 still works.
    timada-dev:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3000"
          - url: "http://host.docker.internal:3001"
          - url: "http://host.docker.internal:3002"
        healthCheck:
          path: /auth/login
          interval: 2s
          timeout: 1s
    # The example storefront (`make storefront`).
    storefront-dev:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3456"

# The store API, for storefronts: STORE_ADDR=store.timada.localhost:4320 with
# STORE_TLS_CA=/etc/ssl/certs/ca-certificates.crt. Traefik ends TLS here and
# hands plain TCP to whichever node answers (each node's `store_api.listen`
# on 0.0.0.0:4321, 4322 and 4323). A storefront whose node goes away
# reconnects through here to another one.
tcp:
  routers:
    store-api:
      rule: "HostSNI(`store.timada.localhost`)"
      entryPoints:
        - store
      service: store-api
      tls: {}
  services:
    store-api:
      loadBalancer:
        servers:
          - address: "host.docker.internal:4321"
          - address: "host.docker.internal:4322"
          - address: "host.docker.internal:4323"
