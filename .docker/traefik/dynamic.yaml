tls:
  certificates:
    - certFile: /etc/traefik/certs/timada.crt
      keyFile: /etc/traefik/certs/timada.key
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/timada.crt
        keyFile: /etc/traefik/certs/timada.key

http:
  routers:
    timada-dev:
      rule: "Host(`timada.localhost`)"
      tls: true
      service: timada-dev
      priority: 25
      entryPoints:
        - https
    storefront-dev:
      rule: "Host(`storefront.localhost`)"
      tls: true
      service: storefront-dev
      priority: 25
      entryPoints:
        - https
    # `make e2e` runs the browser suite on one server per Playwright worker
    # (scripts/e2e.sh), on the cluster's ports: s<N>.timada.localhost reaches
    # server N alone.
    timada-e2e-0:
      rule: "Host(`s0.timada.localhost`)"
      tls: true
      service: timada-e2e-0
      entryPoints:
        - https
    timada-e2e-1:
      rule: "Host(`s1.timada.localhost`)"
      tls: true
      service: timada-e2e-1
      entryPoints:
        - https
    timada-e2e-2:
      rule: "Host(`s2.timada.localhost`)"
      tls: true
      service: timada-e2e-2
      entryPoints:
        - https

  services:
    # The three nodes of the local cluster (`cluster.web_peers` in
    # config/default.toml). Nodes that are not running fail the health check
    # and are left out, so a single `make dev` on port 3000 still works.
    timada-dev:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3000"
          - url: "http://host.docker.internal:3001"
          - url: "http://host.docker.internal:3002"
        healthCheck:
          # 503 while a node's read models trail the store (one catching up
          # after a restart, a copy or a rebuild): it is left out meanwhile.
          path: /ready
          interval: 2s
          timeout: 1s
    # The storefront (`make storefront`).
    storefront-dev:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3457"
    # The servers of `make e2e`, one each and with no health check: a server
    # stalled by the disk flushing a build answers late rather than not at all.
    timada-e2e-0:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3000"
    timada-e2e-1:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3001"
    timada-e2e-2:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3002"

# The store API, for the shops: STORE_ADDR=store.timada.localhost:4320 with
# STORE_TLS_CA=/etc/ssl/certs/ca-certificates.crt. Traefik ends TLS here and
# hands plain TCP to whichever node answers (each node's `store_api.listen`
# on 0.0.0.0:4321, 4322 and 4323). A storefront whose node goes away
# reconnects through here to another one.
tcp:
  routers:
    store-api:
      rule: "HostSNI(`store.timada.localhost`)"
      entryPoints:
        - store
      service: store-api
      tls: {}
  services:
    store-api:
      loadBalancer:
        servers:
          - address: "host.docker.internal:4321"
          - address: "host.docker.internal:4322"
          - address: "host.docker.internal:4323"
