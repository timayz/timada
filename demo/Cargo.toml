[package]
name = "demo"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# Deliver e-mails over SMTP (`TIMADA_SMTP_URL`) instead of logging them.
smtp = ["timada-mailer/smtp"]
# Take payments through Stripe (`TIMADA_STRIPE_*`) instead of capturing them
# by hand from the admin.
stripe = ["timada-payment/stripe"]

[dependencies]
timada-core.workspace = true
timada-catalog.workspace = true
timada-pricing.workspace = true
timada-inventory.workspace = true
timada-review.workspace = true
timada-customer.workspace = true
timada-cart.workspace = true
timada-order.workspace = true
timada-shipping.workspace = true
timada-invoice = { workspace = true, features = ["pdf"] }
timada-payment.workspace = true
timada-mailer = { workspace = true, features = ["invoice-pdf"] }
timada-returns.workspace = true
timada-tax.workspace = true
timada-promotion.workspace = true
timada-admin = { workspace = true, features = ["pdf"] }
evento.workspace = true
topcoat = { workspace = true, features = ["router", "view", "cookie", "session", "asset", "serve", "discover", "tower", "sitemap"] }
sqlx.workspace = true
sqlx_migrator.workspace = true
serde.workspace = true
form_urlencoded = "1"
argon2.workspace = true
tokio.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
timada-core = { workspace = true, features = ["test-support"] }
http = "1"

[lints]
workspace = true
