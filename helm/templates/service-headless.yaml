# Gives each pod a name of its own (`timada-<i>.timada-headless`), which is
# how the nodes of a cluster reach each other, on the ports below and no
# other: a pod comes back at another address, under the same name.
apiVersion: v1
kind: Service
metadata:
  name: timada-headless
spec:
  type: ClusterIP
  clusterIP: None
  # A node must find the others before it is ready: it is ready once it
  # takes writes, which takes a majority of them.
  publishNotReadyAddresses: true
  ports:
    # The store.
    - name: cluster
      port: 7000
      targetPort: 7000
      protocol: TCP
    # Pictures, keys and limits between the nodes.
    - name: cluster-web
      port: 7001
      targetPort: 7001
      protocol: TCP
  selector:
    app: timada
