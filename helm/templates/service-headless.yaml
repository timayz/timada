# Gives each pod a name of its own (`timada-<i>.timada-headless`), which is
# how the nodes of a cluster reach each other: a pod comes back at another
# address, under the same name.
apiVersion: v1
kind: Service
metadata:
  name: timada-headless
spec:
  type: ClusterIP
  clusterIP: None
  # A node must find the others before it is ready: it is ready once it
  # takes writes, which takes a majority of them.
  publishNotReadyAddresses: true
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
    - name: cluster
      port: 7000
      targetPort: 7000
      protocol: TCP
  selector:
    app: timada
