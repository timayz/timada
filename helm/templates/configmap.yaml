{{- $config := deepCopy .Values.config }}
{{- $nodes := include "timada.nodes" . | int }}
{{- $first := int (.Values.firstNodeId | default 0) }}
{{- if and (gt $first 0) (not .Values.peers) }}
{{- fail "firstNodeId is for a cluster whose other nodes run elsewhere: give `peers`, the whole cluster's list" }}
{{- end }}
{{- with .Values.workGroups }}
{{- if ne (len .) $nodes }}
{{- fail (printf "workGroups names %d work groups for %d nodes: one a node, in the order of the pods" (len .) $nodes) }}
{{- end }}
{{- if dig "server" "work_group" "" $config }}
{{- fail "workGroups gives each node a work group and config.server.work_group gives them all the same one: set one of the two" }}
{{- end }}
{{- end }}
{{- if include "timada.clustered" . }}
{{- /*
The `[cluster]` section. Inside one release: each pod's name under the
headless Service, in the order of the pods' ordinals, so a pod's ordinal is
its `node_id` (set in its environment by the StatefulSet). With `peers`, the
list given, which is the whole cluster's, the nodes of other releases
included: this release's pods are those numbered from `firstNodeId`. Each
node is reached on port 7001 under the same name, for what the nodes ask of
each other besides the store (`web_peers`). Both ports are mutual TLS, with
the certificate cert-manager's CSI driver gives the pod (`tls`). What
`config.cluster` sets besides (`absent_after_secs`, `write_backlog`) is
kept. `founders` says how many of the nodes the cluster started with, once
it was given more.
*/}}
{{- $peers := list }}
{{- if .Values.peers }}
{{- $peers = .Values.peers }}
{{- if gt (add $first $nodes) (len $peers) }}
{{- fail (printf "this release's nodes are numbered %d to %d, and peers lists %d: every node of the cluster is in the list, at its number" $first (sub (add $first $nodes) 1) (len $peers)) }}
{{- end }}
{{- else }}
{{- range $i := until $nodes }}
{{- $peers = append $peers (printf "timada-%d.timada-headless:7000" $i) }}
{{- end }}
{{- end }}
{{- $webPeers := list }}
{{- range $peer := $peers }}
{{- $webPeers = append $webPeers (printf "https://%s:7001" (regexReplaceAll ":[0-9]+$" $peer "")) }}
{{- end }}
{{- $tls := dict "ca" "/etc/cluster/tls/ca.crt" "cert" "/etc/cluster/tls/tls.crt" "key" "/etc/cluster/tls/tls.key" }}
{{- $generated := dict "peers" $peers "web_peers" $webPeers "listen" "0.0.0.0:7000" "web_listen" "0.0.0.0:7001" "tls" $tls }}
{{- with .Values.founders }}
{{- if or (lt (int .) 2) (gt (int .) (len $peers)) }}
{{- fail "founders is how many nodes the cluster started with: at least 2, and no more than the nodes there are now" }}
{{- end }}
{{- $_ := set $generated "founders" (int .) }}
{{- end }}
{{- $_ := set $config "cluster" (merge $generated ($config.cluster | default dict)) }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: timada-config
data:
{{- if .Values.workGroups }}
  {{- /*
  A file a pod, under the pod's name, the same but for its work group: each
  pod reads its own (`timada.configFile`).
  */}}
  {{- range $i, $group := .Values.workGroups }}
  {{- $own := deepCopy $config }}
  {{- $_ := set $own "server" (merge (dict "work_group" $group) ($own.server | default dict)) }}
  timada-{{ add $first $i }}.toml: |
{{ $own | toToml | indent 4 }}
  {{- end }}
{{- else }}
  config.toml: |
{{ $config | toToml | indent 4 }}
{{- end }}
