{{- if and (gt (include "timada.nodes" . | int) 1) (not (hasKey .Values.extraSecretEnv "TIMADA__CLUSTER__SECRET")) }}
{{- fail "several nodes need extraSecretEnv.TIMADA__CLUSTER__SECRET: at least 32 characters, shared by the nodes" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: timada-env
type: Opaque
stringData:
  {{- range $key, $value := .Values.extraSecretEnv }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
