apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: timada
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway-system
  # Hostnames matching HTTP header.
  hostnames:
    - {{ .Values.hostname | quote }}
  # List of rules and filters applied.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: timada
          group: ""
          port: 3000
          weight: 1
