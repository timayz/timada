apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timada
  labels:
    app: timada
spec:
  serviceName: timada
  # One node. A cluster names its nodes by IP address (`cluster.peers`), which
  # a pod does not keep across restarts, so this chart does not run one.
  replicas: 1
  selector:
    matchLabels:
      app: timada
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: timada
      annotations:
        # A changed configuration or secret restarts the pod.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 90 }}
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
      containers:
        - name: timada
          image: timayz/timada:{{ .Values.image.tag }}
          imagePullPolicy: IfNotPresent
          # Opening the store applies its pending migrations: no step before it.
          command:
            ["timada-dashboard", "serve", "--config", "/etc/timada/config.toml"]
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              readOnly: true
              mountPath: /etc/timada
            - name: data
              mountPath: /var/lib/timada
          envFrom:
            - secretRef:
                name: timada-env
          ports:
            - name: http
              containerPort: 3000
            {{- if .Values.config.store_api }}
            - name: store-api
              containerPort: 4321
            {{- end }}
          # The port opens once the read models caught up with the store.
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            failureThreshold: {{ div (.Values.startupSeconds | default 1800 | int) 5 }}
          # 503 while the node refuses writes or a read model trails the store
          # (`monitoring.ready_lag_secs`): kept out of the Service meanwhile.
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            periodSeconds: 10
          # Not `/ready`: a node catching up is alive, and restarting it would
          # only make it start over.
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: timada-config

  volumeClaimTemplates:
    - metadata:
        name: data
        {{- if .Values.persistence.longhornCritical }}
        labels:
          recurring-job-group.longhorn.io/critical: enabled
        {{- end }}
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
