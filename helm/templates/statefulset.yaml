{{- if ne (len (.Values.zones | default list | uniq)) (len (.Values.zones | default list)) }}
{{- fail "zones names a zone twice: one node runs in each zone named" }}
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: timada
  labels:
    app: timada
spec:
  serviceName: timada-headless
  replicas: {{ include "timada.nodes" . }}
  {{- with .Values.firstNodeId }}
  # The pods are numbered from here: a pod's ordinal is its node's number in
  # the cluster, whose first nodes run in other releases.
  ordinals:
    start: {{ int . }}
  {{- end }}
  # Every pod starts at once: a node takes writes, and so becomes ready, once
  # a majority of them is up, which one pod waiting for the one before it to
  # be ready would never see.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: timada
  # One pod at a time, the next once the one before is ready again: the
  # others are a majority meanwhile.
  updateStrategy:
    rollingUpdate:
      partition: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: timada
      annotations:
        # A changed configuration or secret restarts the pod.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds | default 90 }}
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
      {{- if or .Values.zones (gt (include "timada.nodes" . | int) 1) }}
      affinity:
        {{- with .Values.zones }}
        # Only in the zones named.
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: topology.kubernetes.io/zone
                    operator: In
                    values:
                      {{- toYaml . | nindent 22 }}
        {{- end }}
        {{- if gt (include "timada.nodes" . | int) 1 }}
        # Each node on a machine of its own where there are enough of them: two
        # on the one that fails would leave no majority.
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: timada
        {{- end }}
      {{- end }}
      {{- with .Values.zones }}
      # One node a zone. A zone that has no machine left keeps its node
      # waiting (`minDomains`): it does not go and double another zone, which
      # going down would then take two nodes away.
      topologySpreadConstraints:
        - maxSkew: 1
          minDomains: {{ len . }}
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: timada
      {{- end }}
      {{- if .Values.database.migrate }}
      initContainers:
        # Creates the store if needed and applies its pending migrations,
        # before the server starts on it.
        - name: timada-migrate
          image: timayz/timada:{{ .Values.image.tag }}
          imagePullPolicy: IfNotPresent
          command:
            ["timada-dashboard", "migrate", "--config", "/etc/timada/config.toml"]
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              readOnly: true
              mountPath: /etc/timada
            - name: data
              mountPath: /var/lib/timada
          envFrom:
            - secretRef:
                name: timada-env
          {{- with include "timada.nodeEnv" . }}
          {{- . | nindent 10 }}
          {{- end }}
      {{- end }}
      containers:
        - name: timada
          image: timayz/timada:{{ .Values.image.tag }}
          imagePullPolicy: IfNotPresent
          command:
            ["timada-dashboard", "serve", "--config", "/etc/timada/config.toml"]
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: config
              readOnly: true
              mountPath: /etc/timada
            - name: data
              mountPath: /var/lib/timada
          envFrom:
            - secretRef:
                name: timada-env
          {{- with include "timada.nodeEnv" . }}
          {{- . | nindent 10 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3000
            {{- if .Values.config.store_api }}
            - name: store-api
              containerPort: 4321
            {{- end }}
            {{- if include "timada.clustered" . }}
            - name: cluster
              containerPort: 7000
            - name: cluster-web
              containerPort: 7001
            {{- end }}
          {{- if gt (int .Values.preStopSeconds) 0 }}
          # A pod told to stop goes on serving while the Service and the
          # gateway learn it is leaving: stopped at once, the requests still
          # sent its way are refused or left without an answer.
          lifecycle:
            preStop:
              sleep:
                seconds: {{ int .Values.preStopSeconds }}
          {{- end }}
          # The port opens once the read models caught up with the store.
          startupProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 5
            failureThreshold: {{ div (.Values.startupSeconds | default 1800 | int) 5 }}
          # 503 while the node refuses writes or a read model trails the store
          # (`monitoring.ready_lag_secs`): kept out of the Service meanwhile.
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            periodSeconds: 10
          # Not `/ready`: a node catching up is alive, and restarting it would
          # only make it start over.
          livenessProbe:
            tcpSocket:
              port: 3000
            periodSeconds: 15
            failureThreshold: 3
      volumes:
        - name: config
          configMap:
            name: timada-config

  volumeClaimTemplates:
    - metadata:
        name: data
        {{- if .Values.persistence.longhornCritical }}
        labels:
          recurring-job-group.longhorn.io/critical: enabled
        {{- end }}
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
