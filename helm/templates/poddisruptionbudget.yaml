{{- if gt (int .Values.replicas) 1 }}
# A machine being emptied takes one node away at a time: the others are still
# a majority, and go on taking writes.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: timada
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: timada
{{- end }}
