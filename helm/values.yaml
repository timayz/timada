# Container image.
image:
  tag: "0.1.0"

# How many nodes run. One runs alone. Three (or five) are a cluster: each
# keeps the whole store on a volume of its own, and they go on taking writes
# while a majority of them is up, so one of three may be down or restarting.
# The chart then writes the `[cluster]` section itself (each pod by its name,
# its ordinal as its `node_id`); `config.cluster` may still set
# `absent_after_secs` and `write_backlog`. The nodes talk over mutual TLS,
# each with a certificate of its own: see `clusterCa`. Needs Kubernetes 1.28
# or later (the pod's ordinal as a label).
# A cluster takes nodes more while it runs: see `founders`. A node that runs
# alone stays alone: start with three where there may be more one day.
replicas: 1

# The zones the nodes run in, as the machines' `topology.kubernetes.io/zone`
# label names them, e.g. [eu-west-1a, eu-west-1b, eu-west-1c]. One node runs
# in each, so the list sets how many there are and `replicas` is not read: a
# zone going down takes one node away. A zone without a machine to run on
# keeps its node waiting. The volumes must be made where the pod is placed:
# see `persistence.storageClassName`. Empty: `replicas` nodes, wherever they
# fit.
zones: []

# A work group for each node, in the order of the pods, e.g.
# [eu-west-1a, eu-west-1b, eu-west-1c]: one name a node, as many as there are
# nodes. Data created through a node is tagged with its work group, and the
# background work on it (payments, supplier orders, invoices, mails) is done
# by that node. Empty: each pod takes its own name (`timada-0`), which does
# the same under another name; see `config.server.work_group` to give every
# node one group instead. Data keeps the group it was created in, so the
# names are chosen once: the work on the data of a group no node answers for
# any more falls to one of the other nodes. The names say nothing of
# where a pod runs: `zones` does, and does not promise the first pod the
# first zone.
workGroups: []

# How many nodes the cluster was founded with, to set once it is given more:
# left out, every node founds it, which is right for a first install and
# wrong ever after. To add a node to a cluster that runs:
#   1. set `founders` to the count the cluster started with (and never change
#      it again: a cluster founded with three nodes says 3 however many it
#      has now), and add a zone at the end of `zones`, or raise `replicas`;
#   2. the new pod starts over its empty volume and waits, not ready; the
#      other pods are restarted onto the longer list only once it is, so
#      nothing else moves yet;
#   3. as a platform administrator, open "This node" on any node and add the
#      node there (the form offers its number and address): it copies the
#      store, becomes ready, and the others restart one at a time.
# To take the last node away: remove it on that page first, from another
# node, then drop its zone or lower `replicas`, and delete its volume claim
# (`data-timada-<n>`): a node that was removed does not start again over its
# old files. Only the last node can go this way, as the pods are numbered.
# An even count gains nothing in what may be down: go from three to five.
# founders: 3

# For one cluster whose nodes run in several Kubernetes clusters, a release
# of this chart in each (one a region, say, three zones in each): the nodes
# of all the releases are one store, every one holding all of it, and each
# must reach every other, from one Kubernetes cluster to another, on port
# 7000 (the store) and 7001 (pictures, keys and limits between the nodes),
# under one name a pod. The names below are whatever does that for a single
# pod where you run: a headless Service exported between the clusters gives
# one per pod. Both ports are mutual TLS: each pod's certificate holds the
# name it has here, and the releases share one authority (`clusterCa`).
#
# `peers` is every node of the cluster as the others dial it, in the order of
# their numbers, the same list in every release; each node is reached on
# 7001 under the same name. `firstNodeId` is the number of this release's
# first pod: with three pods a release, 0 in the first, 3 in the second, 6 in
# the third; its pods are then named `timada-3`, `timada-4`, `timada-5`, and
# are at those places in the list. A release's pods must be
# `timada-<number>.<one rest>` in it, which is what their certificates hold.
# Left out, the chart writes the list itself for a cluster inside this one
# release.
#
# To start such a cluster: install every release with the lists of all the
# nodes (they become ready once most of them are up), or install the first
# with `founders` at its own count in every release and add the nodes of the
# others on the cluster page as they start, as above.
# firstNodeId: 3
# peers:
#   - timada-0.timada-headless.timada.svc.eu-west-1.example:7000
#   - timada-1.timada-headless.timada.svc.eu-west-1.example:7000
#   - timada-2.timada-headless.timada.svc.eu-west-1.example:7000
#   - timada-3.timada-headless.timada.svc.eu-west-3.example:7000
#   - timada-4.timada-headless.timada.svc.eu-west-3.example:7000
#   - timada-5.timada-headless.timada.svc.eu-west-3.example:7000
firstNodeId: 0
peers: []

# The nodes of a cluster let each other in by their certificates: every pod
# gets one of its own as it starts, for the name the others dial it at, from
# cert-manager's CSI driver (csi.cert-manager.io), which must run in the
# Kubernetes cluster beside cert-manager. Its key is made on the machine the
# pod runs on and never leaves it; the certificate is renewed in place, with
# no restart. A node presenting a certificate the others do not accept is
# said so on the cluster page and in `timada_peers_refused`, not taken for a
# node that is away.
#
# They are issued by an authority of the cluster's own. Left empty, a release
# makes one (a self-signed CA, in the `timada-cluster-ca` secret). The
# releases of one cluster over several Kubernetes clusters (`peers`) must
# share one: make it once, and create the same secret in each before
# installing, e.g.
#   openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
#     -keyout ca.key -out ca.crt -days 3650 -subj "/CN=timada cluster" \
#     -addext basicConstraints=critical,CA:TRUE \
#     -addext keyUsage=critical,keyCertSign,cRLSign
#   kubectl -n timada create secret tls timada-cluster-ca --cert=ca.crt --key=ca.key
clusterCa:
  secretName: ""

# Extra environment variables injected from the managed Secret. Every key of
# the configuration can be set as TIMADA__<SECTION>__<KEY>, which wins over
# `config` below: use it for what must not sit in a ConfigMap. A deployment
# needs at least
#   TIMADA__AUTH__SECRET_KEY   at least 32 characters
#   TIMADA__AUTH__ROOT__EMAIL  the root account's address: above every user,
#                              it signs in with this address and the password
#                              below, and makes the administrators
#   TIMADA__AUTH__ROOT__PASSWORD_HASH
#                              what `timada-dashboard hash-password` prints
#                              for that password, read on its standard input
#   TIMADA__SECRETS__KEY       at least 32 characters; never change it
#   TIMADA__MAIL__SMTP_URL     smtps://user:pass@host:465
extraSecretEnv: {}

database:
  # Run `timada-dashboard migrate` before the server starts.
  migrate: true

hostname: "timada.app"

# Time allowed for the pod to shut down gracefully on a rolling update. Must be
# long enough to drain HTTP and the store API, stop every worker and close the
# store.
terminationGracePeriodSeconds: 90

# How long a pod told to stop goes on serving first, in seconds, while the
# Service and the gateway stop sending it requests; counted in the time above.
# Needs Kubernetes 1.30 or later; 0 stops the pod at once.
preStopSeconds: 5

# How long the server may take to start listening, in seconds. It listens once
# its read models caught up with the store, which after a `rebuild` or on a
# large store takes minutes.
startupSeconds: 1800

# Written as the server's configuration file. Every key and its default is in
# config/default.toml; only what a deployment sets apart is here.
config:
  server:
    url: "https://timada.app"
    host: "0.0.0.0"
    port: 3000
    # `work_group` is left out on purpose: each pod then takes its own name for
    # it (`timada-0`), so the background work on what a node created
    # (payments, supplier orders, invoices, mails) is done by that node, and
    # a node more is that much more of it done at once. A node down for a
    # minute has that work taken on by one of the others until it is back;
    # pages and writes go on through the others all along. Set it here to
    # give every node the same one instead: each then does all of that work.
    # `workGroups`, above, names each pod's instead of its pod name.
    # The gateway's addresses, as IP addresses or CIDR networks: without
    # them the sign-in history and the limits see the gateway instead of the
    # visitor. Set it to the cluster's pod network.
    trusted_proxies: []

  database:
    path: "/var/lib/timada/timada.db"

  auth:
    rp_name: "Timada"
    # "open": anyone creates an account from the login page. "invitation":
    # only the people the root account invites, from the page of users.
    signup: "open"

  mail:
    from: "Timada <no-reply@timada.app>"

  media:
    dir: "/var/lib/timada/media"
    public_url: "https://timada.app/media"

  data_keys:
    dir: "/var/lib/timada/shopper-keys"

  # Where storefronts connect, on the Service's port 4321. Without the
  # certificate files a key travels in clear text: fine inside the cluster,
  # not beyond it. Remove the section to not expose the store API.
  store_api:
    listen: "0.0.0.0:4321"
    # Address shown on the API keys page for storefronts to connect to.
    public_addr: "timada:4321"

  monitoring:
    log_level: "info,tantivy=warn,turso_core::mvcc=warn"
    log_json: true
    log_target: true
    log_line_number: true

persistence:
  size: 15Gi
  # StorageClass for the data volume (the store, the pictures and the
  # personal-data keys). Longhorn by default; set to a local-disk class (e.g.
  # "local-path") for lower fsync latency: every write to the store is synced.
  # With `zones`, a class whose volumes live in one zone must make them where
  # the pod was placed (`volumeBindingMode: WaitForFirstConsumer`): made
  # beforehand, they may all be in the same zone and hold the pods there.
  storageClassName: "longhorn"
  # When true, labels the PVC into Longhorn's "critical" recurring-job group
  # (snapshots + S3 backups). Set false when the volume does not live on
  # Longhorn. Mind that a backup also keeps the personal-data keys, and
  # restoring an old one brings deleted accounts back: keep them short-lived.
  longhornCritical: true

certificate:
  annotations: {}
