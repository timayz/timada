[package]
name = "storefront-example"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
publish = false
description = "A minimal merchant storefront on timada-storefront: a product list and product pages in plain HTML"

[[bin]]
name = "storefront"
path = "src/main.rs"

[dependencies]
timada-storefront = { path = "../../crates/storefront" }
topcoat = { version = "=0.11.0", features = ["anyhow", "multipart"] }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
