[workspace]
resolver = "3"
members = ["crates/*", "demo", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/timayz/timada"

[workspace.dependencies]
timada-core = { path = "crates/core" }
timada-catalog = { path = "crates/catalog" }
timada-pricing = { path = "crates/pricing" }
timada-inventory = { path = "crates/inventory" }
timada-review = { path = "crates/review" }
timada-customer = { path = "crates/customer" }
timada-cart = { path = "crates/cart" }
timada-payment = { path = "crates/payment" }
timada-shipping = { path = "crates/shipping" }
timada-order = { path = "crates/order" }
timada-invoice = { path = "crates/invoice" }
timada-promotion = { path = "crates/promotion" }
timada-mailer = { path = "crates/mailer" }
timada-returns = { path = "crates/returns" }
timada-tax = { path = "crates/tax" }
timada-sourcing = { path = "crates/sourcing" }
timada-admin = { path = "crates/admin" }

# 2.x is a pre-release: a bare "2" would not resolve, so pin the alpha exactly.
evento = { version = "=2.0.0-alpha.28", features = ["sqlite"] }
bitcode = "0.6"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
sqlx_migrator = { version = "0.19", features = ["sqlite"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
thiserror = "2"
topcoat = { version = "=0.9.0", default-features = false }
serde = { version = "1", features = ["derive"] }
argon2 = "0.5"
krilla = { version = "0.8", default-features = false, features = ["simple-text"] }
# Same major as krilla shapes with: measured widths are the drawn widths.
rustybuzz = "0.20"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
