[workspace]
members = [
	"crates/*",
	"dashboard",
	"examples/*"
]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["timada team"]

[workspace.dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal"] }
topcoat = { version = "=0.10.0", features = ["tailwind", "anyhow", "mail", "mail-smtp"] }
# The standalone crates, for a library crate (a library names them directly;
# only an application depends on the facade).
topcoat-core = { version = "=0.10.0", features = ["anyhow"] }
topcoat-router = "=0.10.0"
topcoat-view = "=0.10.0"
topcoat-view-macro = "=0.10.0"
sqlx = { version = "0.9", default-features = false, features = ["migrate", "runtime-tokio", "sqlite"] }
sqlx_migrator = { version = "0.19", features = ["sqlite"] }
evento = { version = "=2.0.0-alpha.35", features = ["sqlite", "remote"] }
evento-sql = { version = "=2.0.0-alpha.35", features = ["sqlite", "accord"] }
evento-sql-migrator = { version = "=2.0.0-alpha.35", features = ["sqlite", "accord"] }
evento-accord = "=2.0.0-alpha.35"
evento-lock = "=2.0.0-alpha.35"
bitcode = "0.6"
argon2 = { version = "0.5", features = ["std"] }
ulid = "3.0"
deunicode = "1.6"
openidconnect = "4.0.1"
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
webauthn-rs-proto = "0.5.5"
serde_json = "1.0"
base64 = "0.22"
rand = "0.9"
casbin = "2.20"
async-trait = "0.1"
tokio-rustls = "0.26"
rcgen = "0.14"
uuid = { version = "1", features = ["v5"] }
ciborium = "0.2"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.6", features = ["derive", "env"] }
config = { version = "0.15", features = ["toml"] }

[profile.release]
codegen-units = 1
panic = "abort"
lto = true
strip = true

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package.'*']
opt-level = 3
debug = false

[profile.debugging]
inherits = "dev"
debug = true

