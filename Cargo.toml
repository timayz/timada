[workspace]
members = [
	"crates/*",
	"dashboard",
	"examples/*"
]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["timada team"]

[workspace.dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal", "fs"] }
topcoat = { version = "=0.11.0", features = ["tailwind", "anyhow", "mail", "mail-smtp", "fs", "multipart"] }
# The standalone crates, for a library crate (a library names them directly;
# only an application depends on the facade).
topcoat-core = { version = "=0.11.0", features = ["anyhow"] }
topcoat-router = "=0.11.0"
topcoat-view = "=0.11.0"
topcoat-view-macro = "=0.11.0"
sqlx = { version = "0.9", default-features = false, features = ["migrate", "runtime-tokio", "sqlite"] }
sqlx_migrator = { version = "0.20", features = ["sqlite"] }
evento = { version = "=2.0.0-alpha.36", features = ["sqlite", "remote"] }
evento-sql = { version = "=2.0.0-alpha.36", features = ["sqlite", "accord"] }
evento-sql-migrator = { version = "=2.0.0-alpha.36", features = ["sqlite", "accord"] }
evento-accord = "=2.0.0-alpha.36"
evento-lock = "=2.0.0-alpha.36"
bitcode = "0.6"
argon2 = { version = "0.5", features = ["std"] }
ulid = "3.0"
libc = "0.2"
deunicode = "1.6"
openidconnect = "4.0.1"
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation", "conditional-ui"] }
webauthn-rs-proto = "0.5.5"
serde_json = "1.0"
base64 = "0.22"
rand = "0.9"
casbin = "2.20"
async-trait = "0.1"
tokio-rustls = "0.26"
# Reads a picture's kind and size from its header bytes alone.
imagesize = "0.14"
# A picture's bytes, shared by the copies sent to the other nodes.
bytes = "1"
rcgen = "0.14"
uuid = { version = "1", features = ["v5"] }
ciborium = "0.2"
# Stripe, for the tenants' payments: the 1.0 line is split per resource, so
# only what is used compiles. Pinned exactly while it is a release candidate.
async-stripe = { version = "=1.0.0-rc.9", default-features = false, features = ["rustls-tls-webpki-roots", "rustls-aws-lc-rs"] }
async-stripe-core = { version = "=1.0.0-rc.9", features = ["payment_intent", "refund", "balance"] }
async-stripe-types = { version = "=1.0.0-rc.9" }
# Encrypts the tenants' payment secrets; checks Stripe's webhook signatures.
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
# VAT rates by country and level, for sales across borders. Pinned: its rates
# are data, and a new version changes what new invoices say.
world-tax = "=0.5.2"
rust_iso3166 = "=0.2.0"
# Draws the invoices as PDF: Typst as a library, with the fonts it ships.
typst = "=0.15.1"
typst-as-lib = "=0.17.0"
typst-pdf = "=0.15.1"
typst-assets = { version = "=0.15.1", features = ["fonts"] }
serde = { version = "1.0", features = ["derive"] }
# The shop mails merchants write: a sandboxed template language whose
# variables are HTML-escaped, and an HTML scanner that refuses scripts in them.
minijinja = { version = "3.0", default-features = false, features = ["builtins", "fuel", "serde"] }
lol_html = "3.0"
# The storefront library's one HTTP call (handing in a review with its
# photos). The crypto provider is the process-wide one rustls already uses.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots-no-provider", "multipart", "json"] }
# Reads and writes the gzipped catalogue snapshots a shop is seeded from.
flate2 = "1"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.6", features = ["derive", "env"] }
config = { version = "0.15", features = ["toml"] }

[profile.release]
codegen-units = 1
panic = "abort"
lto = true
strip = true

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package.'*']
opt-level = 3
debug = false

[profile.debugging]
inherits = "dev"
debug = true



