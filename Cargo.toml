[workspace]
members = [
	"crates/*",
	"dashboard"
]
resolver = "2"

[workspace.package]
edition = "2024"
authors = ["timada team"]

[workspace.dependencies]
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal"] }
topcoat = { version = "=0.10.0", features = ["tailwind", "anyhow"] }
sqlx = { version = "0.9", default-features = false, features = ["migrate", "runtime-tokio", "sqlite"] }
sqlx_migrator = { version = "0.19", features = ["sqlite"] }
evento = { version = "=2.0.0-alpha.31", features = ["sqlite"] }
evento-sql = { version = "=2.0.0-alpha.31", features = ["sqlite", "accord"] }
evento-sql-migrator = { version = "=2.0.0-alpha.31", features = ["sqlite", "accord"] }
# Cargo.lock pins tokio-util to 0.7.19: 0.7.20 added `Encoder<&[u8]>` for
# `LengthDelimitedCodec`, which makes `framed.flush()` in evento-accord
# 2.0.0-alpha.31 (`src/tcp.rs:419`) ambiguous and fail to compile. Drop the pin
# (`cargo update -p tokio-util`) once evento ships the fix.
evento-accord = "=2.0.0-alpha.31"
evento-lock = "=2.0.0-alpha.31"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4.6", features = ["derive", "env"] }
config = { version = "0.15", features = ["toml"] }

[profile.release]
codegen-units = 1
panic = "abort"
lto = true
strip = true

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package.'*']
opt-level = 3
debug = false

[profile.debugging]
inherits = "dev"
debug = true
