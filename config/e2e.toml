# End-to-end test configuration, used by `make e2e` (scripts/e2e.sh): a
# throwaway database that is reset before every run, with the root account
# the tests administer it as. scripts/e2e.sh runs three servers on
# it, each taking its own ports, files and address from TIMADA__* variables,
# and the stand-ins below 100 ports further on for each next server.
# Everything in here is a test fixture; nothing is a secret.

[server]
# Traefik from compose.yml forwards to this process from the Docker bridge, and
# its X-Forwarded-For is then used. Docker's port publishing still hides the
# browser behind the bridge gateway (172.18.0.1 rather than 127.0.0.1); on a
# host where the proxy sees clients directly, the real address comes through.
trusted_proxies = ["172.16.0.0/12"]

[database]
path = "data/e2e-timada.db"

[media]
dir = "data/e2e-media"
public_url = "https://timada.localhost/media"

[data_keys]
dir = "data/e2e-shopper-keys"

# The browser suite cannot drive it (the Rust integration test does); it is
# here so the server under test boots the listener too.
[store_api]
listen = "127.0.0.1:4321"
public_addr = "localhost:4321"

# Card payments against a stand-in for Stripe's API that the payments spec
# starts (tests/e2e/stripe.ts), itself in front of stripe-mock from compose.yml.
[payments]
stripe_api_url = "http://127.0.0.1:12112"

# VAT numbers are checked against a stand-in for VIES that the storefront
# spec starts (tests/e2e/vies.ts).
[invoicing]
vies_url = "http://127.0.0.1:12113"
# Nothing listens here: the suite sells in euros and never reads the Bank.
euro_rates_url = "http://127.0.0.1:12114"

# Sales are told to a stand-in for Meta's Conversions API that the storefront
# spec starts (tests/e2e/meta.ts).
[advertising]
meta_api_url = "http://127.0.0.1:12115"

# Review requests go out within seconds of falling due.
[reviews]
request_check_secs = 2

# Campaigns go out within a couple of seconds of being sent.
[newsletter]
send_check_secs = 2

# Automation runs move within a second of falling due.
[automations]
check_secs = 1

# Every spec signs shoppers in, sends messages, signs up to newsletters and
# starts carts from this one machine, so the limits are far above what the
# suite asks for.
[store]
shopper_codes_per_ip = 1000
shopper_codes_per_key = 10000
contact_messages_per_ip = 1000
contact_messages_per_key = 10000
newsletter_signups_per_ip = 1000
newsletter_signups_per_key = 10000
carts_per_ip = 1000
carts_per_key = 10000

# A sale reaches the shop's best sellers within the test that makes it.
[best_sellers]
check_secs = 2

# AliExpress is the stand-in the spec starts (tests/e2e/aliexpress.ts); the
# imported products are read again every few seconds, and at every payment. An
# open order keeps the day's wait, so only its push reads it.
[aliexpress]
app_key = "34567"
app_secret = "ae-e2e-s3cret"
api_url = "http://127.0.0.1:12114"
authorize_url = "http://127.0.0.1:12114/oauth/authorize"
sync_check_secs = 2
sync_every_secs = 3
parcel_read_every_secs = 1
calls_per_day = 8640000
read_fresh_secs = 0
# The specs price from the stand-in's costs alone; the EU's charges on imports
# have tests of their own (dashboard/src/aliexpress/tests.rs).
import_duty_cents = 0
import_fee_cents = 0

# Keywords come from a stand-in for DataForSEO (tests/e2e/dataforseo.ts).
[dataforseo]
login = "keywords-e2e@example.com"
password = "dataforseo-e2e-s3cret"
api_url = "http://127.0.0.1:12116"

# A shop connects its Google account to a stand-in for Google
# (tests/e2e/google.ts), which says yes at once.
[google]
client_id = "timada-e2e.apps.googleusercontent.com"
client_secret = "google-e2e-s3cret"
authorize_url = "http://127.0.0.1:12117/o/oauth2/v2/auth"
token_url = "http://127.0.0.1:12117/token"
userinfo_url = "http://127.0.0.1:12117/v1/userinfo"
search_console_url = "http://127.0.0.1:12117/webmasters/v3"
ads_url = "http://127.0.0.1:12117/ads/v26"
# A site just chosen is read within a couple of seconds, and so is a Google
# Ads account.
search_check_secs = 1
ads_check_secs = 1
merchant_url = "http://127.0.0.1:12117/merchant"
merchant_check_secs = 1
# A member may ask for another read at once.
merchant_ask_again_secs = 0

# Texts are drafted by a stand-in for the model (tests/e2e/writer.ts), which
# counts every call at 1,500 tokens read and 900 written: 0.024 USD at these
# prices. The caps are out of the suite's reach.
[writer]
key = "writer-e2e-s3cret"
api_url = "http://127.0.0.1:12118"
daily_usd_per_shop = 100.0
daily_usd = 10000.0

# A user's day has room for three of the stand-in's calls (0.01248 USD each,
# held at 0.132 before they are made); the fourth is refused
# (research.spec.ts). The platform's cap is out of the suite's reach.
[research]
daily_usd_per_user = 0.16
daily_usd = 1000.0

# Every spec invites from a handful of accounts, so the limits on invitations
# are far above what the suite sends.
[invitations]
per_tenant = 10000
per_account = 10000

[auth]
secret_key = "e2e-only-secret-key-never-used-outside-the-test-suite"

# The suite signs in as root with "root e2e password" (tests/e2e/fixtures.ts).
[auth.root]
email = "root-e2e@example.com"
password_hash = "$argon2id$v=19$m=19456,t=2,p=1$+IKabEeK+GG1eYkDTHfYqg$+KNJCjGFTZT/3qJMR6dkSZp2jyHik2V5G8XSr+4jhkE"

# The dex container from compose.yml; see .docker/dex/config.yaml.
[auth.providers.dex]
label = "Dex"
issuer = "http://localhost:5556/dex"
client_id = "timada"
client_secret = "timada-e2e-client-secret"

# The development mailbox from compose.yml; the tests read the codes back
# through its API on port 1080. A shop's own server is that same mailbox, on
# this machine.
[mail]
from = "Timada <no-reply@timada.localhost>"
smtp_url = "smtp://localhost:1025"
allow_private_hosts = true

[secrets]
key = "e2e-only-secrets-key-never-used-outside-the-test-suite"

[monitoring]
log_level = "info,timada_dashboard=debug,tantivy=warn,turso_core::mvcc=warn"
