# End-to-end test configuration, used by `make e2e` (scripts/e2e.sh): a
# throwaway database that is reset before every run, so the first user the
# tests register is the administrator. Everything in here is a test fixture;
# nothing is a secret.

[server]
# Traefik from compose.yml forwards to this process from the Docker bridge, and
# its X-Forwarded-For is then used. Docker's port publishing still hides the
# browser behind the bridge gateway (172.18.0.1 rather than 127.0.0.1); on a
# host where the proxy sees clients directly, the real address comes through.
trusted_proxies = ["172.16.0.0/12"]

[database]
url = "sqlite:data/e2e.db"

[tenants]
dir = "data/e2e-tenants"

[media]
dir = "data/e2e-media"
public_url = "https://timada.localhost/media"

# The browser suite cannot drive it (the Rust integration test does); it is
# here so the server under test boots the listener too.
[store_api]
listen = "127.0.0.1:4321"
public_addr = "localhost:4321"

# Card payments against a stand-in for Stripe's API that the payments spec
# starts (tests/e2e/stripe.ts), itself in front of stripe-mock from compose.yml.
[payments]
secret_key = "e2e-only-payments-key-never-used-outside-the-test-suite"
stripe_api_url = "http://127.0.0.1:12112"

# VAT numbers are checked against a stand-in for VIES that the storefront
# spec starts (tests/e2e/vies.ts).
[invoicing]
vies_url = "http://127.0.0.1:12113"

# Review requests go out within seconds of falling due.
[reviews]
request_check_secs = 2

[auth]
secret_key = "e2e-only-secret-key-never-used-outside-the-test-suite"

# The dex container from compose.yml; see .docker/dex/config.yaml.
[auth.providers.dex]
label = "Dex"
issuer = "http://localhost:5556/dex"
client_id = "timada"
client_secret = "timada-e2e-client-secret"

# The development mailbox from compose.yml; the tests read the codes back
# through its API on port 1080. A shop's own server is that same mailbox, on
# this machine.
[mail]
from = "Timada <no-reply@timada.localhost>"
smtp_url = "smtp://localhost:1025"
allow_private_hosts = true

[secrets]
key = "e2e-only-secrets-key-never-used-outside-the-test-suite"

[monitoring]
log_level = "info,timada_dashboard=debug"
