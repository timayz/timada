# Full configuration shape. Every key here has a built-in default; a file given
# with `--config` (or TIMADA_CONFIG) overrides it, and TIMADA__<SECTION>__<KEY>
# environment variables override both (e.g. TIMADA__SERVER__PORT=3100).

[server]
# Public base URL (behind Traefik), logged when `serve` is ready.
url = "https://timada.localhost"
host = "0.0.0.0"
port = 3000
# Region this node serves, e.g. "eu-west-1" or "us-east-3". Data created here
# is tagged with it, so background processing can be scoped per region. Omit
# for a single-region deployment.
# region = "eu-west-1"
# Reverse proxies whose X-Forwarded-For header is trusted, as IP addresses or
# CIDR networks. Without it the sign-in history records the proxy's address.
# Behind the Docker-hosted Traefik of compose.yml: ["172.16.0.0/12"].
trusted_proxies = []

[database]
# sqlx DSN. The file holds events, projections and the consensus journal.
url = "sqlite:data/timada.db"
# Pool size for `serve`; sqlx-sqlite runs one OS thread per open connection.
max_connections = 3

[auth]
# Protects sign-in attempts that are still in progress (the state carried in
# the browser between the first and last step). At least 32 characters; set it
# through TIMADA__AUTH__SECRET_KEY in production rather than in this file.
# Rotating it only interrupts sign-ins in progress.
# secret_key = ""
# How long a signed-in session stays valid, in seconds (14 days). A session in
# use is renewed for the full duration once half of it has elapsed, so only
# idle browsers are signed out.
session_lifetime_secs = 1209600
# Name the browser shows when someone creates a passkey for this site.
rp_name = "Timada"

# Sign-in providers (OpenID Connect). One table per provider; the table key is
# the name used in URLs (/auth/oauth2/<name>): lowercase letters, digits, - and _.
# Register "<server.url>/auth/oauth2/<name>/callback" as the redirect URI at the
# provider. A provider defined only through environment variables needs all
# four keys set (TIMADA__AUTH__PROVIDERS__GOOGLE__LABEL and so on).
# [auth.providers.google]
# label = "Google"
# issuer = "https://accounts.google.com"
# client_id = ""
# client_secret = ""   # or TIMADA__AUTH__PROVIDERS__GOOGLE__CLIENT_SECRET
#
# For local development, compose.yml ships a dex provider with a fixed test
# user; config/e2e.toml shows the block to copy.

[mail]
# Signing up, signing in and resetting a password with an e-mail address each
# mail a one-time code. This is the sender shown on those messages.
from = "Timada <no-reply@timada.localhost>"
# Where outgoing mail is submitted. "smtp://host:port" talks to a server
# without encryption (a local mailbox); "smtp://user:pass@host:587?tls=required"
# upgrades to TLS; "smtps://user:pass@host:465" connects over TLS. The default
# is the development mailbox from compose.yml, whose inbox is readable at
# http://localhost:1080. Set TIMADA__MAIL__SMTP_URL in production.
smtp_url = "smtp://localhost:1025"
# A shop can send its mails to shoppers (order confirmations, review requests,
# sign-in codes) through a mail server of its own, set on /t/<slug>/mail;
# shops without one use the server above, under their own name. A shop's
# server may not be on this machine or a private network unless this is true:
# leave it off outside development, or merchants could reach internal services.
# allow_private_hosts = false

# The key that seals the secrets merchants hand over (their mail server
# passwords, and their payment keys unless payments.secret_key is set) before
# they are stored, and the shopper keys below. At least 32 characters, the
# same on every node; changing it makes the stored secrets unreadable, and
# merchants then enter them again, and every shopper account loses its
# addresses. Without it, shops cannot set up a mail server of their own and
# shoppers cannot create accounts.
# Set TIMADA__SECRETS__KEY in production.
# [secrets]
# key = "at least 32 characters, the same on every node"

[tenants]
# Directory holding one database per tenant (its events and its consensus
# journal). Created on demand.
dir = "data/tenants"
# Most tenant databases open at once; beyond it the least recently used is
# closed, and the next request opens it again. Each open database may hold
# three connections (one OS thread each). Unset, it is worked out at startup
# from the open-file limit and the available memory, and written to the log.
# max_open = 64

[media]
# Directory holding the pictures merchants upload for their products, one
# sub-directory per tenant. Created on demand.
dir = "data/media"
# The address this node's /media is reached at from the outside, or of a cache
# in front of it. Shoppers' browsers load the product pictures from here, so it
# has to work from outside the server. Shown on each tenant's API keys page for
# its storefront to be configured with.
public_url = "https://timada.localhost/media"

[data_keys]
# Directory holding the keys personal data is encrypted with: one per shopper
# account and one per contact-form message, one sub-directory per tenant. A
# shopper's e-mail address and saved addresses, and what a visitor wrote
# through the contact form, are recorded only encrypted with their key, so
# deleting an account or erasing a message deletes its key and leaves what was
# recorded unreadable for good. Every node keeps every key, sealed with
# secrets.key. Keep backups of this directory short-lived, or not at all:
# restoring an old copy brings deleted data back. Losing it on every node
# loses every account and every message.
dir = "data/shopper-keys"

# Card payments. Each tenant connects its own Stripe account on
# /t/<slug>/payments; the account's secrets are kept encrypted with
# secret_key, which every node shares (changing it makes the stored secrets
# unreadable: merchants then enter them again). Unset, secrets.key is used.
# Without this section, tenants cannot take payments.
# [payments]
# secret_key = "at least 32 characters, the same on every node"
# # Where Stripe's API is reached; Stripe's own address when unset.
# stripe_api_url = "http://localhost:12111"

# Invoices. A business buyer's EU VAT number is checked with VIES, the
# European Commission's service, before an invoice goes without VAT.
# [invoicing]
# # Where VIES is reached; the Commission's own address when unset.
# vies_url = "https://ec.europa.eu/taxation_customs/vies/rest-api"

# Reviews. Some days after an order is fulfilled (each shop picks how many
# on its Reviews page), its buyer gets a mail asking for a review.
# [reviews]
# # How often, in seconds, this node looks for buyers due that mail.
# request_check_secs = 3600

# What storefronts may ask for their shoppers. A storefront has the shop mail
# sign-in codes and hands in the messages of its contact form; past these
# limits it is refused for a while and nothing is mailed or recorded. A
# shopper is the address the storefront reports for them, and is counted per
# shop. Each node counts on its own, so behind a balancer over N nodes a
# client may get up to N times these.
# [store]
# # Codes one shopper's address may have mailed within the window.
# shopper_codes_per_ip = 10
# # Codes one API key may have mailed within the window, whoever the shoppers.
# shopper_codes_per_key = 100
# # The window both limits count over, in seconds.
# shopper_codes_window_secs = 600
# # Messages one visitor's address may send through the contact form within
# # the window.
# contact_messages_per_ip = 5
# # Messages one API key may hand in within the window, whoever the visitors.
# contact_messages_per_key = 200
# # The window both message limits count over, in seconds.
# contact_messages_window_secs = 3600

# How many invitations members may mail. Past either limit, the members page
# refuses to send another one until older ones leave the window. Withdrawn
# and accepted invitations still count. The limits hold across every node.
# [invitations]
# # Invitations one tenant may send within the window, whoever sends them.
# per_tenant = 50
# # Invitations one account may send within the window, across its tenants.
# per_account = 20
# # The window both limits count over, in seconds.
# window_secs = 86400

# Products a shop imports from AliExpress, through the merchant's own
# AliExpress app (registered on AliExpress's open platform, with
# dropshipping access). The app's secret and the tokens of the account it
# acts for are kept encrypted under `secrets.key`; without it no shop can
# connect. Only the addresses of AliExpress's own services can be changed
# (tests point them at a stand-in).
# [aliexpress]
# api_url = "https://api-sg.aliexpress.com"
# authorize_url = "https://api-sg.aliexpress.com/oauth/authorize"

# The store API: where a merchant's storefront connects with one of the
# tenant's API keys (created on /t/<slug>/api-keys) to read and write that
# tenant's events. A connected storefront keeps its tenant's database open.
# Omit the whole section to not expose it on this node.
# [store_api]
# listen = "0.0.0.0:4321"
# # Address shown on the API keys page for storefronts to connect to.
# public_addr = "timada.localhost:4321"
# # PEM files; with both set, connections are encrypted. Without them a key
# # travels in clear text: only on a private network or behind a proxy that
# # terminates TLS.
# tls_cert = "/etc/timada/store-api.crt"
# tls_key = "/etc/timada/store-api.key"

# Multi-node cluster. Omit the whole section to run a single node: it then
# talks to itself over a loopback port chosen by the system. Writes need a
# majority of nodes, so a 3-node cluster keeps working with one node down.
# `node_id` is this node's index into `peers`. Every node hosts every tenant.
# With several nodes, a page that reads what it just wrote waits for the other
# nodes' latest writes first (one extra round trip per read), so what a user
# sees after an action is always current whichever node answers.
# [cluster]
# node_id = 0
# peers = ["127.0.0.1:7000", "127.0.0.1:7001", "127.0.0.1:7002"]
# # Bind address for inbound peer traffic; defaults to peers[node_id].
# listen = "0.0.0.0:7000"
# # Each node's web address (server.port) as the other nodes reach it, in the
# # order of `peers`. Every node keeps a copy of every product picture: an
# # upload is copied to the other nodes and only saved once a majority of them
# # hold it, and a node that missed one fetches it from the others. Required
# # with more than one node.
# web_peers = ["http://127.0.0.1:3000", "http://127.0.0.1:3001", "http://127.0.0.1:3002"]
# # Shared by every node, at least 32 characters: a node only takes a picture
# # from a peer presenting it. Set it through TIMADA__CLUSTER__SECRET rather
# # than in this file. Required with more than one node.
# secret = ""
# # Every finished write is kept on the other nodes until the node that missed
# # it has it too. A node not heard from on a tenant for this long is no longer
# # waited for: the others tidy up without it, and when it returns every tenant
# # it fell behind on is copied back from a peer. 0 never gives a node up.
# absent_after_secs = 3600
# # Finished writes a tenant keeps for a node that is away. Past it the tenant
# # refuses new writes until the node returns or is given up. The admin page of
# # a tenant shows what it keeps, and the log warns at four fifths.
# write_backlog = 100000

[monitoring]
log_level = "info,sqlx=warn"
log_json = false
log_target = true
log_line_number = true
