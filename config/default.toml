# Full configuration shape. Every key here has a built-in default; a file given
# with `--config` (or TIMADA_CONFIG) overrides it, and TIMADA__<SECTION>__<KEY>
# environment variables override both (e.g. TIMADA__SERVER__PORT=3100).

[server]
# Public base URL (behind Traefik), logged when `serve` is ready.
url = "https://timada.localhost"
host = "0.0.0.0"
port = 3000
# Region this node serves, e.g. "eu-west-1" or "us-east-3". Data created here
# is tagged with it, so background processing can be scoped per region. Omit
# for a single-region deployment.
# region = "eu-west-1"
# Reverse proxies whose X-Forwarded-For header is trusted, as IP addresses or
# CIDR networks. Without it the sign-in history records the proxy's address.
# Behind the Docker-hosted Traefik of compose.yml: ["172.16.0.0/12"].
trusted_proxies = []

[database]
# sqlx DSN. The file holds events, projections and the consensus journal.
url = "sqlite:data/timada.db"
# Pool size for `serve`; sqlx-sqlite runs one OS thread per open connection.
max_connections = 3

[auth]
# Protects sign-in attempts that are still in progress (the state carried in
# the browser between the first and last step). At least 32 characters; set it
# through TIMADA__AUTH__SECRET_KEY in production rather than in this file.
# Rotating it only interrupts sign-ins in progress.
# secret_key = ""
# How long a signed-in session stays valid, in seconds (14 days). A session in
# use is renewed for the full duration once half of it has elapsed, so only
# idle browsers are signed out.
session_lifetime_secs = 1209600
# Name the browser shows when someone creates a passkey for this site.
rp_name = "Timada"

# Sign-in providers (OpenID Connect). One table per provider; the table key is
# the name used in URLs (/auth/oauth2/<name>): lowercase letters, digits, - and _.
# Register "<server.url>/auth/oauth2/<name>/callback" as the redirect URI at the
# provider. A provider defined only through environment variables needs all
# four keys set (TIMADA__AUTH__PROVIDERS__GOOGLE__LABEL and so on).
# [auth.providers.google]
# label = "Google"
# issuer = "https://accounts.google.com"
# client_id = ""
# client_secret = ""   # or TIMADA__AUTH__PROVIDERS__GOOGLE__CLIENT_SECRET
#
# For local development, compose.yml ships a dex provider with a fixed test
# user; config/e2e.toml shows the block to copy.

[mail]
# Signing up, signing in and resetting a password with an e-mail address each
# mail a one-time code. This is the sender shown on those messages.
from = "Timada <no-reply@timada.localhost>"
# Where outgoing mail is submitted. "smtp://host:port" talks to a server
# without encryption (a local mailbox); "smtp://user:pass@host:587?tls=required"
# upgrades to TLS; "smtps://user:pass@host:465" connects over TLS. The default
# is the development mailbox from compose.yml, whose inbox is readable at
# http://localhost:1080. Set TIMADA__MAIL__SMTP_URL in production.
smtp_url = "smtp://localhost:1025"

[tenants]
# Directory holding one database per tenant (its events and its consensus
# journal). Created on demand.
dir = "data/tenants"
# A tenant's database is closed after this long without a request, in seconds;
# the next request opens it again.
idle_timeout_secs = 300
# Most tenant databases open at once; beyond it the least recently used is
# closed. Each open database may hold three connections (one OS thread each).
max_open = 64

[media]
# Directory holding the pictures merchants upload for their products, one
# sub-directory per tenant. Created on demand.
dir = "data/media"
# The address this node's /media is reached at from the outside, or of a cache
# in front of it. Shoppers' browsers load the product pictures from here, so it
# has to work from outside the server. Shown on each tenant's API keys page for
# its storefront to be configured with.
public_url = "https://timada.localhost/media"

# The store API: where a merchant's storefront connects with one of the
# tenant's API keys (created on /t/<slug>/api-keys) to read and write that
# tenant's events. A connected storefront keeps its tenant's database open.
# Omit the whole section to not expose it on this node.
# [store_api]
# listen = "0.0.0.0:4321"
# # Address shown on the API keys page for storefronts to connect to.
# public_addr = "timada.localhost:4321"
# # PEM files; with both set, connections are encrypted. Without them a key
# # travels in clear text: only on a private network or behind a proxy that
# # terminates TLS.
# tls_cert = "/etc/timada/store-api.crt"
# tls_key = "/etc/timada/store-api.key"

# Multi-node cluster. Omit the whole section to run a single node: it then
# talks to itself over a loopback port chosen by the system. Writes need a
# majority of nodes, so a 3-node cluster keeps working with one node down.
# `node_id` is this node's index into `peers`. Every node hosts every tenant.
# With several nodes, a page that reads what it just wrote waits for the other
# nodes' latest writes first (one extra round trip per read), so what a user
# sees after an action is always current whichever node answers.
# [cluster]
# node_id = 0
# peers = ["127.0.0.1:7000", "127.0.0.1:7001", "127.0.0.1:7002"]
# # Bind address for inbound peer traffic; defaults to peers[node_id].
# listen = "0.0.0.0:7000"

[monitoring]
log_level = "info,sqlx=warn"
log_json = false
log_target = true
log_line_number = true
