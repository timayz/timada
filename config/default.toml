# Full configuration shape. Every key here has a built-in default; a file given
# with `--config` (or TIMADA_CONFIG) overrides it, and TIMADA__<SECTION>__<KEY>
# environment variables override both (e.g. TIMADA__SERVER__PORT=3100).

[server]
# Public base URL (behind Traefik), logged when `serve` is ready.
url = "https://timada.localhost"
host = "0.0.0.0"
port = 3000
# The work group this node belongs to: one word, e.g. "node-a", or
# "eu-west-1" for the nodes of one place. Data created through this node is
# tagged with it, and the background work on that data (payments, supplier
# orders, invoices, mails) is done by the nodes of that group alone; the
# pages and their lists see every group's data. A group of one node, each
# node its own, spreads that work over the nodes: a node more is that much
# more of it done at once. Omit it everywhere and every node does all the
# work. Data keeps the group it was created in: the background work on data
# created without one is done by the nodes without one, and by those that
# say `also_works_for_ungrouped`. A group none of whose nodes was heard from
# for a minute has its work taken on by one of the nodes up that have a
# group, until one of its own is back.
# work_group = "node-a"
# Work groups whose background work this node takes on all the time, besides
# its own. Needs `work_group`.
# also_works_for = ["node-b"]
# Also take on the background work on the data created without a work group.
# Set it on at least one node when giving work groups to a deployment that
# ran without them, and keep it: otherwise no node does that work once every
# node has a group. Needs `work_group`.
# also_works_for_ungrouped = true
# Reverse proxies whose X-Forwarded-For header is trusted, as IP addresses or
# CIDR networks. Without it the sign-in history records the proxy's address.
# Behind the Docker-hosted Traefik of compose.yml: ["172.16.0.0/12"].
trusted_proxies = []

[database]
# The database file: every tenant's events, the snapshots, the subscription
# cursors and the consensus journal (what the cluster replicates), and the
# read-model tables the pages read. `timada-dashboard migrate` creates it and
# applies what a new version adds to its schema; `serve` does neither, and
# refuses to start until it is done. A `-wal` and a `-log` file live next to
# it and belong with it.
path = "data/timada.db"

[auth]
# Protects sign-in attempts that are still in progress (the state carried in
# the browser between the first and last step). At least 32 characters; set it
# through TIMADA__AUTH__SECRET_KEY in production rather than in this file.
# Rotating it only interrupts sign-ins in progress.
# secret_key = ""
# How long a signed-in session stays valid, in seconds (14 days). A session in
# use is renewed for the full duration once half of it has elapsed, so only
# idle browsers are signed out.
session_lifetime_secs = 1209600
# Name the browser shows when someone creates a passkey for this site.
rp_name = "Timada"
# How many times a password may be tried within the window, from one browser
# address and against one e-mail address, right or wrong, before the form says
# to wait. The limits hold across every node (see [store] below).
# login_attempts_per_ip = 30
# login_attempts_per_email = 10
# login_window_secs = 900
# Who creates an account. "open": anyone, from the login page, with an e-mail
# address and a password or through a sign-in provider. "invitation": nobody
# on their own; the root account (below) has a link mailed to an address from
# the page of users, valid for 7 days, and the link creates the account of
# that address and no other. An invitation to join a shop then lets an
# account in, and creates none. Root invites whichever value is set; the
# accounts that exist sign in as before. The same on every node.
# signup = "open"

# The root account: above every user, and out of their reach. Required. It is
# defined here and nowhere else: nobody registers it, and no page changes its
# address or its password. It signs in on the login page with this address
# and this password alone (no code is mailed, so it gets in while no mail
# leaves). It is an administrator nobody can demote, delete or sign out, the
# only one who makes and unmakes administrators or deletes one, and it opens
# every shop as an owner. Nobody else registers with its address.
# The password is kept as its hash, which
#   timada-dashboard hash-password
# prints for the password it reads on its standard input; set it through
# TIMADA__AUTH__ROOT__PASSWORD_HASH in production rather than in this file,
# the same on every node. A change takes effect at the next start; the
# browsers root is signed in on stay so until root signs them out (its
# account page).
# [auth.root]
# email = "root@example.com"
# password_hash = "$argon2id$v=19$m=19456,t=2,p=1$..."

# Sign-in providers (OpenID Connect). One table per provider; the table key is
# the name used in URLs (/auth/oauth2/<name>): lowercase letters, digits, - and _.
# Register "<server.url>/auth/oauth2/<name>/callback" as the redirect URI at the
# provider. A provider defined only through environment variables needs all
# four keys set (TIMADA__AUTH__PROVIDERS__GOOGLE__LABEL and so on).
# [auth.providers.google]
# label = "Google"
# issuer = "https://accounts.google.com"
# client_id = ""
# client_secret = ""   # or TIMADA__AUTH__PROVIDERS__GOOGLE__CLIENT_SECRET
#
# For local development, compose.yml ships a dex provider with a fixed test
# user; config/e2e.toml shows the block to copy.

[mail]
# Signing up, signing in and resetting a password with an e-mail address each
# mail a one-time code. This is the sender shown on those messages.
from = "Timada <no-reply@timada.localhost>"
# Where outgoing mail is submitted. "smtp://host:port" talks to a server
# without encryption (a local mailbox); "smtp://user:pass@host:587?tls=required"
# upgrades to TLS; "smtps://user:pass@host:465" connects over TLS. The default
# is the development mailbox from compose.yml, whose inbox is readable at
# http://localhost:1080. Set TIMADA__MAIL__SMTP_URL in production.
smtp_url = "smtp://localhost:1025"
# A shop can send its mails to shoppers (order mails, review requests, sign-in
# codes) through a mail server of its own, set on /t/<slug>/mail;
# shops without one use the server above, under their own name. A shop's
# server may not be on this machine or a private network unless this is true:
# leave it off outside development, or merchants could reach internal services.
# allow_private_hosts = false

# The key that seals the secrets merchants hand over (their mail server
# passwords and their payment keys) before they are stored, and the shopper
# keys below. At least 32 characters, the
# same on every node; changing it makes the stored secrets unreadable, and
# merchants then enter them again, and every shopper account loses its
# addresses. Without it, shops cannot set up a mail server of their own and
# shoppers cannot create accounts.
# Set TIMADA__SECRETS__KEY in production.
# [secrets]
# key = "at least 32 characters, the same on every node"

[media]
# Directory holding the pictures merchants upload for their products, one
# sub-directory per tenant. Created on demand.
dir = "data/media"
# The address this node's /media is reached at from the outside, or of a cache
# in front of it. Shoppers' browsers load the product pictures from here, so it
# has to work from outside the server. Shown on each tenant's API keys page for
# its storefront to be configured with. Put a cache in front of it in
# production (see docs/architecture.md, "Product pictures"): the files never
# change, so it may keep them for as long as it likes.
public_url = "https://timada.localhost/media"
# How much disk one tenant's pictures may take, in bytes, in their two
# renditions (a few tens of kilobytes per picture). The platform can set it
# apart for a tenant on its admin page. 0 is no quota.
tenant_quota_bytes = 5368709120
# How often, in seconds, this node compares its picture files with what the
# store knows: files nobody references any more are deleted, files missing or
# damaged are fetched from the other nodes again.
reconcile_check_secs = 86400

[data_keys]
# Directory holding the keys personal data is encrypted with: one per shopper
# account, newsletter subscriber and contact-form message, one sub-directory
# per tenant. A shopper's e-mail address and saved addresses, a subscriber's
# address, and what a visitor wrote through the contact form, are recorded
# only encrypted with their key, so deleting an account or erasing a message
# deletes its key and leaves what was recorded unreadable for good. Every node
# keeps every key, sealed with secrets.key; a node that joins copies them from
# another before it serves. Keep backups of this directory short-lived, or not
# at all: restoring an old copy brings deleted data back. Losing it on every
# node loses every account and every message.
dir = "data/shopper-keys"

# Card payments. Each tenant connects its own Stripe account on
# /t/<slug>/payments; the account's secrets are kept encrypted with
# secrets.key. Without this section, tenants cannot take payments.
# [payments]
# # Where Stripe's API is reached; Stripe's own address when unset.
# stripe_api_url = "http://localhost:12111"
# # How often, in seconds, this node looks for card forms left open past
# # the half hour their goods were held for, and closes them with Stripe so
# # nothing is charged for goods that may be gone; and for orders whose money
# # Stripe was asked to take or give back without answering, and settles them.
# cancel_check_secs = 60

# Invoices. A business buyer's EU VAT number is checked with VIES, the
# European Commission's service, before an invoice goes without VAT. A sale
# priced in another currency than the euro is counted against the EU
# distance-sales threshold, and states its VAT in euros, at the European
# Central Bank's daily reference rate.
# [invoicing]
# # Where VIES is reached; the Commission's own address when unset.
# vies_url = "https://ec.europa.eu/taxation_customs/vies/rest-api"
# # Where the Bank's reference rates are read; the Bank's own address when unset.
# euro_rates_url = "https://www.ecb.europa.eu/stats/eurofxref"

# The shops' advertising platforms. A shop that gave its Meta pixel a
# Conversions API token has its sales told to Meta from here too.
# [advertising]
# # Where Meta is reached; Meta's own address when unset.
# meta_api_url = "https://graph.facebook.com/v26.0"

# Reviews. Some days after an order is fulfilled (each shop picks how many
# on its Reviews page), its buyer gets a mail asking for a review.
# [reviews]
# # How often, in seconds, this node looks for buyers due that mail.
# request_check_secs = 3600

# A shop's newsletter campaign goes out from every node, each mailing its
# own part of the subscribers: one shop's mails one after the other through
# its server, several shops at once. Each subscriber is mailed once.
# [newsletter]
# # How often, in seconds, this node looks for campaigns still going out; a
# # shop's mails go out until shortly before the next look.
# send_check_secs = 60
# # The most mails one campaign sends per look from this node, however fast
# # the shop's server takes them.
# mails_per_check = 1000

# A shop's automation scenarios run from every node: each node starts and
# moves its own part of the runs, on a timer, step by step, and takes over
# the runs another node left for two minutes (or four looks, if longer).
# Each step acts once whichever node moves it.
# [automations]
# # How often, in seconds, this node looks for runs whose next step is due.
# check_secs = 15
# # The most runs one look of this node moves (the runs it leaves where they
# # are, waiting for their shop, do not count).
# runs_per_check = 200
# # How long, in seconds, a scenario's webhook call may take.
# webhook_timeout_secs = 10
# # How long, in seconds, a checkout waits for its order before scenarios on
# # "a checkout left unpaid" start (at least 60).
# abandoned_after_secs = 3600

# What storefronts may ask for their shoppers. A storefront has the shop mail
# sign-in codes, hands in the messages of its contact form and the sign-ups
# to its news, and starts carts; past these limits it is refused for a while
# and nothing is mailed or recorded. A shopper is the address the storefront
# reports for them, and is counted per shop. The limits hold across every
# node: before letting one through, a node asks the others (at their
# web_peers address) what they let through. A node that does not answer
# within two seconds is not counted, and two nodes deciding at the same
# moment may each let the last one through.
# [store]
# # Codes one shopper's address may have mailed within the window.
# shopper_codes_per_ip = 10
# # Codes one API key may have mailed within the window, whoever the shoppers.
# shopper_codes_per_key = 100
# # The window both limits count over, in seconds.
# shopper_codes_window_secs = 600
# # Messages one visitor's address may send through the contact form within
# # the window.
# contact_messages_per_ip = 5
# # Messages one API key may hand in within the window, whoever the visitors.
# contact_messages_per_key = 200
# # The window both message limits count over, in seconds.
# contact_messages_window_secs = 3600
# # Sign-ups to a shop's news one visitor's address may hand in within the
# # window; each mails a link to confirm the address.
# newsletter_signups_per_ip = 5
# # Sign-ups one API key may hand in within the window, whoever the visitors.
# newsletter_signups_per_key = 500
# # The window both sign-up limits count over, in seconds.
# newsletter_signups_window_secs = 3600
# # Carts one visitor's address may start within the window, a start refused
# # for its item (out of stock, say) included. A shopper keeps the cart of
# # their first add, so this holds back visitors that do not.
# carts_per_ip = 30
# # Carts one API key may start within the window, whoever the visitors.
# carts_per_key = 5000
# # The window both cart limits count over, in seconds.
# carts_window_secs = 3600

# Carts nobody touches are dropped after a while: the shopper's next visit
# starts a new one, and the shop's list of open carts forgets them. A cart
# with a payment open, one on its way back or a request to pay unanswered is
# kept until that is settled. Every node drops its own part of them.
# [carts]
# # Days a cart is kept after its last change (at least 1).
# idle_days = 30
# # How often, in seconds, this node looks for carts to drop.
# check_secs = 3600

# A storefront can list its products by what sells best. Every node ranks,
# for its own part of the shops, the products each sold the most units of
# lately, and writes the ranking to the shop's catalog when it changed.
# [best_sellers]
# # Days of sales a ranking counts (at least 1).
# days = 30
# # How often, in seconds, this node ranks its shops.
# check_secs = 21600

# How many invitations members may mail. Past either limit, the members page
# refuses to send another one until older ones leave the window. Withdrawn
# and accepted invitations still count. The limits hold across every node.
# [invitations]
# # Invitations one tenant may send within the window, whoever sends them.
# per_tenant = 50
# # Invitations one account may send within the window, across its tenants.
# per_account = 20
# # The window both limits count over, in seconds.
# window_secs = 86400

# Products the shops import from AliExpress, through the platform's own
# AliExpress app (registered once on AliExpress's open platform, with
# dropshipping access; register `/aliexpress/callback` under `server.url`
# as its callback). Each company connects its own AliExpress buyer
# account to the app from its page, and every shop selling as the company
# buys through that account. The tokens are kept encrypted under
# `secrets.key`; without it, or without the app, no company can connect.
# The nodes share the imported products and the open orders out among those
# up, each reading its own; one node per token renews a company's access before
# it lapses.
# AliExpress counts every call against the one app, whichever company it
# acts for.
# [aliexpress]
# # The app's key and secret, from AliExpress's open platform; both or
# # neither. Register `/aliexpress/callback` under server.url as the app's
# # callback and `/aliexpress/webhook` as its message push callback.
# app_key = ""
# app_secret = ""
# # How often, in seconds, this node renews the access about to lapse and looks
# # for the open orders due to be read.
# sync_check_secs = 3600
# # How long, in seconds, a product goes before its price and stock are read
# # again, if the day's calls reach it.
# sync_every_secs = 86400
# # How long, in seconds, an order placed on AliExpress goes unread before it is
# # read again. AliExpress pushes each change of its status to
# # `/aliexpress/webhook`, so this only catches a push that never came. Without
# # that callback registered, tracking arrives this late: lower it.
# order_read_every_secs = 86400
# # How long, in seconds, a parcel AliExpress shipped goes before AliExpress is
# # asked again where it is, for the shopper's order page, while it moves. One
# # that stays still waits as long as it has been still, up to eight periods.
# # A parcel is followed until it is delivered, or 60 days after it ships: one
# # call per parcel per period at most.
# parcel_read_every_secs = 21600
# # How many calls a day the app may make, over every shop and node: read the
# # app's quota on AliExpress's open platform and set this from it, with a
# # margin. The default is only the ceiling the dropshipping API was known for
# # (500 an hour): a few hundred orders a day placed through the app spend most
# # of it. A sale always reads what it sells, an order placed or pushed is
# # always read; the nodes spend what is left in three lanes: 60 % on the other
# # products (first what shoppers wanted in the last 30 days, then what is on
# # sale, then the rest), 10 % on the open orders no push came for, 30 % on the
# # parcels. 0: nothing but what sales and members ask for.
# calls_per_day = 12000
# # How recent, in seconds, a read of a product must be for a payment to go by
# # it instead of reading the product again. Longer spends fewer calls on what
# # sells a lot; a shopper may then pay a price AliExpress changed that long ago.
# read_fresh_secs = 60
# # What AliExpress adds to an order for each kind of goods it ships into the EU
# # from outside, in euro cents, which imports are priced with: the flat customs
# # duty of a parcel worth 150 EUR or less (3 EUR from 2026-07-01 until
# # 2028-07-01; the destination's VAT goes on top) and the processing fee of any
# # parcel (2 EUR from 2026-11-01). Follow the law here when it changes; 0 for
# # none.
# import_duty_cents = 300
# import_fee_cents = 200
# # How many orders a company's AliExpress account places an hour at most,
# # over every shop it sells for, spread across the hour; the others wait their
# # turn. AliExpress publishes no limit, but many retail orders an hour to many
# # addresses from one buyer account is what risk control flags, and a flagged
# # account places no more orders. 0: as they come.
# orders_per_hour = 0
# # AliExpress's own addresses, changed only for tests.
# api_url = "https://api-sg.aliexpress.com"
# authorize_url = "https://api-sg.aliexpress.com/oauth/authorize"

# Keyword data: how often a query is searched, what a click on it costs, how
# hard it is to rank for. It is read from DataForSEO under the platform's own
# account, which pays for every call: about 0.012 USD a call and 0.00012 USD
# a keyword returned, 0.13 USD for the thousand a call returns at most. The
# account is topped up ahead and a call is refused once it is spent.
# Without this section keyword research is off.
# `timada-dashboard keywords "<a keyword>"` makes one call and prints it:
# the way to check the login.
# [dataforseo]
# # The API login and password, from the account's API Access page (the
# # password is not the one the account signs in with); both or neither.
# # In production: TIMADA__DATAFORSEO__PASSWORD.
# login = ""
# password = ""
# # DataForSEO's own address, changed only for tests.
# api_url = "https://api.dataforseo.com"

# What keyword research may spend. Every call to the keyword source is paid
# by the platform's account, whoever asks, so a day (UTC, midnight to
# midnight) has two caps, in US dollars. They count what the source says each
# call cost. A call is refused before it is made when the most it may cost
# (0.132 USD) no longer fits under a cap, so a cap is never passed and the
# last calls before it are refused while a little is left; a cap under 0.132
# lets no call through. On a cluster the caps hold over every node.
# [research]
# # For one user's calls.
# daily_usd_per_user = 1.0
# # For every user's calls together.
# daily_usd = 10.0
# # For how many days a seed's keywords answer anyone who asks for the same
# # seed, country and language again, at no cost. 0 pays for every fetch.
# reuse_days = 30

# First drafts of the shops' texts: a product's or a category's name, its
# description, and the title and description search engines show, written by
# a model from what the shop knows of the product, for the keyword it is to
# be found by. A draft is never published: it waits under the shop's
# Proposals for a member to edit, approve or refuse.
# The model is reached under the platform's own key, which pays for every
# call. A day (UTC, midnight to midnight) has two caps, in US dollars. They
# count what each call cost, reckoned from the tokens the model says it read
# and wrote at the two prices below. A call is refused before it is made
# when the most it may cost (16,000 tokens each way: 0.384 USD at the
# default prices) no longer fits under a cap, so a cap is never passed. A
# draft costs a few cents. On a cluster the caps hold over every node.
# Without a key text drafts are off, and no page offers them.
# [writer]
# # The API key of the platform's account. In production: TIMADA__WRITER__KEY.
# key = ""
# # Which model writes, and what a million tokens cost it, read and written,
# # in US dollars. Change the three together.
# model = "claude-opus-5-5"
# input_usd_per_mtok = 4.0
# output_usd_per_mtok = 20.0
# # For one shop's drafts.
# daily_usd_per_shop = 5.0
# # For every shop's drafts together.
# daily_usd = 50.0
# # The model's maker's own address, changed only for tests.
# api_url = "https://api.anthropic.com"

# The application the shops connect their Google accounts to: an OAuth client
# of a Google Cloud project of the platform's (APIs & Services, Credentials,
# "Web application"), with <server.url>/google/callback as its one authorized
# redirect URI and the Search Console API enabled. A shop's member says yes
# once on Google's page; what the account grants is kept sealed under
# `secrets.key`, so this needs that key too. Without the id and the secret no
# shop connects a Google account. docs/google.md says what Google asks of the
# application before other people's accounts may say yes to it.
# [google]
# # Both or neither. In production: TIMADA__GOOGLE__CLIENT_SECRET.
# client_id = ""
# client_secret = ""
# # Google's own addresses, changed only for tests.
# authorize_url = "https://accounts.google.com/o/oauth2/v2/auth"
# token_url = "https://oauth2.googleapis.com/token"
# userinfo_url = "https://openidconnect.googleapis.com/v1/userinfo"
# search_console_url = "https://www.googleapis.com/webmasters/v3"
# # How often, in seconds, a node looks for the shops whose daily read of
# # Search Console is due. A shop is read once a day whatever this is.
# search_check_secs = 300

# The store API: where a merchant's storefront connects with one of the
# tenant's API keys (created on /t/<slug>/api-keys) to read and write that
# tenant's events; a connection sees that tenant's streams and nothing else.
# Omit the whole section to not expose it on this node.
# [store_api]
# listen = "0.0.0.0:4321"
# # Address shown on the API keys page for storefronts to connect to.
# public_addr = "timada.localhost:4321"
# # PEM files; with both set, connections are encrypted. Without them a key
# # travels in clear text: only on a private network or behind a proxy that
# # terminates TLS. Open to the internet, put a cap on the connections held
# # at once in front of it too (docs/storefront.md).
# tls_cert = "/etc/timada/store-api.crt"
# tls_key = "/etc/timada/store-api.key"

# Multi-node cluster. Omit the whole section to run a single node: it then
# talks to itself in memory. Writes need a majority of nodes, so a 3-node
# cluster keeps working with one node down. `node_id` is this node's index
# into `peers`. Every node holds a copy of the whole store.
# With several nodes, a page waits for the other nodes' latest writes first
# (one extra round trip per read) where it must be current: for a few seconds
# after the browser changed something, for what the page shows and edits,
# and before a sign-in, a shop or a store key is refused. So what a user sees
# after an action is always current whichever node answers. Read from this
# node's own copy instead: who is signed in, the shop a page belongs to, the
# storefronts' catalog, a shopper's order once this node has it, what the
# node does after each change (its lists, mails and payments), and what it
# does on a timer.
# [cluster]
# node_id = 0
# # Each node as `ip:port` or `host:port`. A name is looked up each time the
# # node is dialled, so a node that comes back at another address is found.
# peers = ["127.0.0.1:7000", "127.0.0.1:7001", "127.0.0.1:7002"]
# # How many of `peers`, the first ones, the cluster was founded with; left
# # out, all of them. To add a node to a cluster that runs: list it after the
# # others here on every node, say here how many there were at the start,
# # start it over an empty store, then add it on the cluster page (Platform,
# # This node). It waits until then, copies the store from a member, and
# # serves. Never change the number afterwards: a cluster founded with three
# # nodes says 3 however many it has now.
# founders = 3
# # Bind address for inbound peer traffic; defaults to peers[node_id] when
# # that is an IP address, and is required when it is a name.
# listen = "0.0.0.0:7000"
# # Each node's web address as the other nodes reach it, in the order of
# # `peers`: the port each keeps for the other nodes, not server.port, which
# # serves none of it. The limits under [auth] and [store] are also asked of
# # the other nodes here. Every node keeps a copy of every product picture: an
# # upload is copied to the other nodes and only saved once a majority of them
# # hold it, and a node that missed one fetches it from the others. Required
# # with more than one node.
# web_peers = ["https://127.0.0.1:7100", "https://127.0.0.1:7101", "https://127.0.0.1:7102"]
# # Bind address for what the other nodes ask of this one; defaults to its
# # entry in web_peers when that is an IP address and a port, and is required
# # when it is a name.
# web_listen = "0.0.0.0:7100"
# # Every finished write is kept on the other nodes until the node that missed
# # it has it too. A node not heard from for this long is no longer waited
# # for: the others tidy up without it, and when it returns it is told so and
# # refuses writes until it copies the store back from a peer (restart it:
# # the copy happens at startup; `timada-dashboard rejoin` asks for one by
# # hand, for a lost store file). A day: copying a large store back takes
# # far longer than catching up on a night's writes, and the backlog below
# # holds days of them. 0 never gives a node up.
# absent_after_secs = 86400
# # Finished writes this node keeps for a node that is away. Past it the node
# # refuses new writes until the node returns or is given up. The node's page
# # under Platform shows what it keeps, and the log warns at four fifths.
# write_backlog = 100000
# # The nodes talk over mutual TLS, on both ports, and let each other in by
# # their certificates: the authority every node's is issued by, this node's
# # certificate and its key, in PEM (the three files of a cert-manager
# # secret). A node is who its certificate names: it must be valid for the
# # host, or the address, the node has in `peers` and `web_peers`. The files
# # are read again every few seconds: a certificate is renewed by replacing
# # them. Required with more than one node; scripts/cluster-cert.sh makes a
# # set for nodes on this machine.
# [cluster.tls]
# ca = "data/cluster-tls/ca.crt"
# cert = "data/cluster-tls/tls.crt"
# key = "data/cluster-tls/tls.key"

[monitoring]
# What gets logged: a level, then overrides per component. The default keeps
# the search index and the store engine to warnings, as both report routine
# work (index commits, checkpoints) at `info`.
log_level = "info,tantivy=warn,turso_core::mvcc=warn"
log_json = false
log_target = true
log_line_number = true
# `GET /ready` on the node's own port answers 200 while the node takes writes
# and no read model trails the store by more than this many seconds, 503
# otherwise, with how far each read model trails in the body: a balancer
# polling it keeps traffic off a node catching up after a night away, a copy
# of the store or a `rebuild`. A node of a cluster takes writes while it
# hears from most of the nodes, itself counted: one that heard nothing from
# the others for 10 seconds, or never since it started, answers 503. A read model is as far
# behind as the oldest event it has not applied yet has been waiting: a worker
# that stopped reads as behind, a store nobody writes to does not. Mind that every node runs the same
# read models: a fault that stops one everywhere takes every node out at
# once. 0 reports the lag and never judges it.
# ready_lag_secs = 300
# Where to serve `/metrics` (Prometheus text: readiness, each read model's
# lag, workers by state, the writes kept for absent nodes, store connections
# by tenant, the consensus engine's counters) and `/ready`. An internal
# address: the figures name tenants. Absent: no metrics.
# metrics_listen = "127.0.0.1:9100"
