services:
  traefik:
    image: "traefik:v3.7"
    group_add:
      - "${DOCKER_GID:-999}"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.api.tls=true"
      - "traefik.http.routers.api.entrypoints=https"
      - "traefik.http.routers.api.service=api@internal"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - ".docker/traefik/traefik.yaml:/etc/traefik/traefik.yml"
      - ".docker/traefik/dynamic.yaml:/etc/traefik/dynamic.yml"
      - ".docker/traefik/certs:/etc/traefik/certs"
    extra_hosts:
      - host.docker.internal:host-gateway

  # MailDev - SMTP testing server with web UI
  # Access web UI at: http://localhost:1080
  # SMTP server runs on: localhost:1025
  maildev:
    image: maildev/maildev:latest
    container_name: timada-maildev
    ports:
      - "1080:1080" # Web UI
      - "1025:1025" # SMTP Server
    environment:
      - MAILDEV_WEB_PORT=1080
      - MAILDEV_SMTP_PORT=1025
    networks:
      - imkitchen-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:1080",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  timada-network:
    driver: bridge

volumes:
  timada-data:
    driver: local
