<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Timada Demo Store{% endblock %}</title>
    <link rel="stylesheet" href="/assets/store.css">
  </head>
  <body class="min-h-screen bg-white text-slate-900">
    <header class="border-b border-slate-200">
      <nav class="mx-auto flex max-w-5xl items-center justify-between px-4 py-3" aria-label="Store">
        <a href="/" class="text-base font-semibold">Timada Demo Store</a>
        <a href="/admin" class="text-sm text-slate-500 hover:text-slate-900">Admin</a>
      </nav>
    </header>
    <main class="mx-auto max-w-5xl px-4 py-6">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
