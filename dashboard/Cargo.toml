[package]
name = "timada-dashboard"
version = "0.1.0"
edition.workspace = true
authors.workspace = true

[dependencies]
tokio.workspace = true
# `ui` makes the component registry available to `topcoat ui`; the vendored
# components draw their icons from the Lucide set `build.rs` stages.
topcoat = { workspace = true, features = ["ui", "icon-iconify"] }
imagesize.workspace = true
bytes.workspace = true
sqlx.workspace = true
sqlx_migrator.workspace = true
evento.workspace = true
timada-core = { path = "../crates/core" }
evento-sql.workspace = true
evento-sql-migrator.workspace = true
evento-accord.workspace = true
serde.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
config.workspace = true
timada-identity = { path = "../crates/identity" }
timada-tenancy = { path = "../crates/tenancy" }
timada-aliexpress = { path = "../crates/aliexpress" }
timada-catalog = { path = "../crates/catalog" }
timada-catalog-import = { path = "../crates/catalog-import" }
timada-orders = { path = "../crates/orders" }
timada-discounts = { path = "../crates/discounts" }
timada-reviews = { path = "../crates/reviews" }
timada-support = { path = "../crates/support" }
timada-newsletter = { path = "../crates/newsletter" }
timada-shoppers = { path = "../crates/shoppers" }
timada-invoicing = { path = "../crates/invoicing", features = ["pdf"] }
openidconnect.workspace = true
webauthn-rs.workspace = true
webauthn-rs-proto.workspace = true
serde_json.workspace = true
base64.workspace = true
uuid.workspace = true
ciborium.workspace = true
casbin.workspace = true
async-trait.workspace = true
tokio-rustls.workspace = true
ulid.workspace = true
async-stripe.workspace = true
async-stripe-core.workspace = true
async-stripe-types.workspace = true
hmac.workspace = true
sha2.workspace = true
aes-gcm.workspace = true
rand.workspace = true
rust_iso3166.workspace = true
reqwest.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[build-dependencies]
topcoat = { version = "=0.10.0", default-features = false, features = ["tailwind", "icon-iconify"] }

[dev-dependencies]
evento-lock.workspace = true
timada-storefront = { path = "../crates/storefront" }
rcgen.workspace = true
