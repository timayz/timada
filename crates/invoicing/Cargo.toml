[package]
name = "timada-invoicing"
version = "0.1.1"
edition.workspace = true
authors.workspace = true
license.workspace = true

[package.metadata.cargo-machete]
ignored = ["bitcode"]

[features]
pdf = [
	"dep:typst",
	"dep:typst-as-lib",
	"dep:typst-pdf",
	"dep:typst-assets",
	"dep:tokio",
]

[dependencies]
evento.workspace = true
timada-core = { path = "../core", version = "0.1.1" }
bitcode.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
world-tax.workspace = true
typst = { workspace = true, optional = true }
typst-as-lib = { workspace = true, optional = true }
typst-pdf = { workspace = true, optional = true }
typst-assets = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[dev-dependencies]
tokio.workspace = true
