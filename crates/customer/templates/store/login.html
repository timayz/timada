{% extends "layout.html" %}

{% block meta %}
  <title>Sign in · Timada Store</title>
{% endblock %}

{% block content %}
  <div class="mx-auto max-w-sm">
    <h1 class="text-xl font-semibold sm:text-2xl">Sign in</h1>
    {% if let Some(error) = error %}
      <p role="alert" class="mt-4 rounded border border-red-300 bg-red-50 p-3 text-sm text-red-900">
        {{ error }}
      </p>
    {% endif %}
    <form method="post" action="/login" class="mt-6 space-y-4 rounded border border-stone-200 bg-white p-6">
      <div>
        <label for="email" class="block text-sm font-medium">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          value="{{ email }}"
          required
          autocomplete="username"
          class="mt-1 w-full rounded border border-stone-300 px-3 py-2 text-sm"
        />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          autocomplete="current-password"
          class="mt-1 w-full rounded border border-stone-300 px-3 py-2 text-sm"
        />
      </div>
      <button
        type="submit"
        class="w-full rounded bg-stone-900 px-3 py-2 text-sm font-medium text-white hover:bg-stone-700"
      >
        Sign in
      </button>
    </form>
    <p class="mt-4 text-sm text-stone-600">
      New here?
      <a href="/register" class="font-medium underline">Create an account</a>
    </p>
  </div>
{% endblock %}
