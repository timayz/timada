{% extends "layout.html" %}

{% block meta %}
  <title>Create account · Timada Store</title>
{% endblock %}

{% block content %}
  <div class="mx-auto max-w-sm">
    <h1 class="text-xl font-semibold sm:text-2xl">Create your account</h1>
    {% if let Some(error) = error %}
      <p role="alert" class="mt-4 rounded border border-red-300 bg-red-50 p-3 text-sm text-red-900">
        {{ error }}
      </p>
    {% endif %}
    <form method="post" action="/register" class="mt-6 space-y-4 rounded border border-stone-200 bg-white p-6">
      <div>
        <label for="full_name" class="block text-sm font-medium">Name</label>
        <input
          type="text"
          id="full_name"
          name="full_name"
          value="{{ full_name }}"
          required
          autocomplete="name"
          class="mt-1 w-full rounded border border-stone-300 px-3 py-2 text-sm"
        />
      </div>
      <div>
        <label for="email" class="block text-sm font-medium">Email</label>
        <input
          type="email"
          id="email"
          name="email"
          value="{{ email }}"
          required
          autocomplete="username"
          class="mt-1 w-full rounded border border-stone-300 px-3 py-2 text-sm"
        />
      </div>
      <div>
        <label for="password" class="block text-sm font-medium">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          required
          minlength="8"
          autocomplete="new-password"
          aria-describedby="password-hint"
          class="mt-1 w-full rounded border border-stone-300 px-3 py-2 text-sm"
        />
        <p id="password-hint" class="mt-1 text-xs text-stone-600">At least 8 characters.</p>
      </div>
      <button
        type="submit"
        class="w-full rounded bg-stone-900 px-3 py-2 text-sm font-medium text-white hover:bg-stone-700"
      >
        Create account
      </button>
    </form>
    <p class="mt-4 text-sm text-stone-600">
      Already have an account?
      <a href="/login" class="font-medium underline">Sign in</a>
    </p>
  </div>
{% endblock %}
