[package]
name = "timada-storefront"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
description = "Headless storefront library: connects a merchant's topcoat app to its timada store"

[dependencies]
topcoat-core.workspace = true
topcoat-router.workspace = true
topcoat-view.workspace = true
topcoat-view-macro.workspace = true
evento.workspace = true
timada-core = { path = "../core" }
tokio.workspace = true
tokio-rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
deunicode.workspace = true
tracing.workspace = true
timada-catalog = { path = "../catalog" }
timada-orders = { path = "../orders" }
timada-reviews = { path = "../reviews" }
timada-shoppers = { path = "../shoppers" }
timada-newsletter = { path = "../newsletter" }
timada-support = { path = "../support" }
timada-pages = { path = "../pages" }
reqwest.workspace = true
bytes.workspace = true
timada-invoicing = { path = "../invoicing", features = ["pdf"] }

[dev-dependencies]
tracing-subscriber.workspace = true
