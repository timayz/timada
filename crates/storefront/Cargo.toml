[package]
name = "timada-storefront"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
description = "Headless storefront library: connects a merchant's topcoat app to its timada store"

[dependencies]
topcoat-core.workspace = true
topcoat-router.workspace = true
topcoat-view.workspace = true
topcoat-view-macro.workspace = true
evento.workspace = true
timada-core = { path = "../core", version = "0.1.0" }
tokio.workspace = true
tokio-rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
deunicode.workspace = true
tracing.workspace = true
timada-catalog = { path = "../catalog", version = "0.1.0" }
timada-orders = { path = "../orders", version = "0.1.0" }
timada-reviews = { path = "../reviews", version = "0.1.0" }
timada-shoppers = { path = "../shoppers", version = "0.1.0" }
timada-newsletter = { path = "../newsletter", version = "0.1.0" }
timada-support = { path = "../support", version = "0.1.0" }
timada-pages = { path = "../pages", version = "0.1.0" }
reqwest.workspace = true
bytes.workspace = true
timada-invoicing = { path = "../invoicing", features = ["pdf"], version = "0.1.0" }
rand.workspace = true
sha2.workspace = true
