[package]
name = "timada-newsletter"
version = "0.1.0"
edition.workspace = true
authors.workspace = true

[dependencies]
evento.workspace = true
timada-core = { path = "../core" }
bitcode.workspace = true
anyhow.workspace = true
thiserror.workspace = true
base64.workspace = true
hmac.workspace = true
sha2.workspace = true
ulid.workspace = true
jiff.workspace = true

[dev-dependencies]
tokio.workspace = true
async-trait.workspace = true

# `#[evento::aggregate]` expands to `bitcode::` paths, so the crate must name the
# dependency even though no source file mentions it.
[package.metadata.cargo-machete]
ignored = ["bitcode"]
