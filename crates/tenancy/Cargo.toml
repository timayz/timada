[package]
name = "timada-tenancy"
version = "0.1.0"
edition.workspace = true
authors.workspace = true

[dependencies]
evento.workspace = true
bitcode.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
ulid.workspace = true
deunicode.workspace = true
rand.workspace = true
base64.workspace = true
sqlx = { workspace = true, features = ["derive"] }
sqlx_migrator.workspace = true
minijinja.workspace = true
lol_html.workspace = true
serde.workspace = true

[dev-dependencies]
tokio.workspace = true

# `#[evento::aggregate]` expands to `bitcode::` paths, so the crate must name the
# dependency even though no source file mentions it.
[package.metadata.cargo-machete]
ignored = ["bitcode"]
