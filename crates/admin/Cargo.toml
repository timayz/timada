[package]
name = "timada-admin"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Mountable topcoat admin for the timada e-commerce contexts"
readme = "README.md"

[features]
axum = ["dep:axum"]
# "Télécharger le PDF" on an issued invoice (pulls the PDF writer and fonts).
pdf = ["timada-invoice/pdf"]

[dependencies]
timada-core.workspace = true
timada-catalog.workspace = true
timada-pricing.workspace = true
timada-inventory.workspace = true
timada-review.workspace = true
timada-customer.workspace = true
timada-order.workspace = true
timada-invoice.workspace = true
timada-mailer.workspace = true
timada-returns.workspace = true
timada-payment.workspace = true
timada-promotion.workspace = true
timada-shipping.workspace = true
timada-tax.workspace = true
evento.workspace = true
topcoat = { workspace = true, features = [
    "router",
    "view",
    "cookie",
    "session",
    "asset",
    "tower",
    "tailwind",
    "discover",
    "multipart",
    "icon",
] }
inventory = "0.3"
sqlx.workspace = true
sqlx_migrator.workspace = true
serde.workspace = true
argon2.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
axum = { version = "0.8", optional = true }

[build-dependencies]
topcoat = { workspace = true, features = ["tailwind"] }

[dev-dependencies]
timada-core = { workspace = true, features = ["test-support"] }
topcoat = { workspace = true, features = ["serve"] }
tokio.workspace = true
tower = { version = "0.5", features = ["util"] }
http = "1"
# The archive's subscriptions render PDFs whether or not the admin serves them.
timada-invoice = { workspace = true, features = ["pdf"] }

[lints]
workspace = true
