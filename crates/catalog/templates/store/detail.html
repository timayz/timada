{% extends "layout.html" %}

{% block meta %}
  <title>{{ product.title }} · Timada Store</title>
  <meta name="description" content="{{ product.description }}" />
{% endblock %}

{% block content %}
  <nav aria-label="Breadcrumb" class="text-sm">
    <a href="/" class="text-stone-600 underline hover:text-stone-900">All products</a>
  </nav>

  <article class="mt-4 grid grid-cols-1 gap-6 sm:grid-cols-2">
    <img
      src="{{ product.image_url }}"
      alt=""
      width="600"
      height="600"
      class="aspect-square w-full rounded border border-stone-200 bg-white object-cover"
    />

    <div>
      <h1 class="text-xl font-semibold sm:text-2xl">{{ product.title }}</h1>
      <p class="mt-2 text-lg font-medium">{{ product.price() }}</p>
      <p class="mt-4 text-sm text-stone-700">{{ product.description }}</p>

      <form method="post" action="/cart/items" class="mt-6 flex flex-wrap items-end gap-3">
        <input type="hidden" name="product_id" value="{{ product.id }}" />
        <div>
          <label for="quantity" class="block text-sm font-medium">Quantity</label>
          <input
            id="quantity"
            type="number"
            name="quantity"
            value="1"
            min="1"
            class="mt-1 w-24 rounded border border-stone-300 px-3 py-2"
          />
        </div>
        <button
          type="submit"
          class="rounded bg-stone-900 px-4 py-2 font-medium text-white hover:bg-stone-700"
        >
          Add to cart
        </button>
      </form>
    </div>
  </article>
{% endblock %}
