<!doctype html>
{# Deliberately standalone: the admin layout's navigation would only offer
   links that bounce straight back here. #}
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Sign in · Timada Admin</title>
    <link rel="stylesheet" href="/assets/app.css" />
  </head>
  <body class="flex min-h-screen items-center justify-center bg-stone-100 text-stone-900">
    <main class="w-full max-w-sm px-4">
      <h1 class="text-center text-xl font-semibold">Timada Admin</h1>
      {% if let Some(error) = error %}
        <p role="alert" class="mt-4 rounded border border-red-300 bg-red-50 p-3 text-sm text-red-900">
          {{ error }}
        </p>
      {% endif %}
      <form method="post" action="/admin/login" class="mt-6 space-y-4 rounded border border-stone-300 bg-white p-6">
        <div>
          <label for="email" class="block text-sm font-medium">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="username"
            class="mt-1 w-full rounded border border-stone-300 px-3 py-2 text-sm"
          />
        </div>
        <div>
          <label for="password" class="block text-sm font-medium">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            required
            autocomplete="current-password"
            class="mt-1 w-full rounded border border-stone-300 px-3 py-2 text-sm"
          />
        </div>
        <button
          type="submit"
          class="w-full rounded bg-stone-900 px-3 py-2 text-sm font-medium text-white hover:bg-stone-700"
        >
          Sign in
        </button>
      </form>
    </main>
  </body>
</html>
