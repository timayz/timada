[package]
name = "timada-loadtest"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
publish = false
description = "Drives a storefront with crowds of random shoppers over plain HTTP, pays through a stand-in for Stripe, and reports latency, throughput and anomalies"

[dependencies]
tokio = { workspace = true, features = ["time", "sync", "net"] }
reqwest.workspace = true
# The crypto provider reqwest's rustls needs installed, once per process.
tokio-rustls.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
rand.workspace = true
regex = "1"
# Latency percentiles without keeping every sample.
hdrhistogram = "7"
# The stand-in for Stripe: a plain HTTP/1 server, and its webhook signatures.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
hmac.workspace = true
sha2.workspace = true
hex = "0.4"
