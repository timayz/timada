[package]
name = "storefront"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license = "MIT OR Apache-2.0"
publish = false
description = "A shop on timada-storefront with no brand and no colours: the structure to start your own from"

[[bin]]
name = "storefront"
path = "src/main.rs"

[dependencies]
timada-storefront = { path = "../crates/storefront" }
topcoat = { version = "=0.12.1", features = ["anyhow", "multipart", "l10n-fluent"] }
tokio.workspace = true
anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = "0.7.1"

[dev-dependencies]
rust_iso3166.workspace = true
